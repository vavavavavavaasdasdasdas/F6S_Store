<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}">
<head>
    <title>Danh sách sản phẩm - SHOP GIÀY</title>
</head>
<body>
    <div th:fragment="content">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản phẩm</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-12 d-lg-none mb-3">
                <button class="btn btn-outline-primary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#filterPanel">
                    <i class="bi bi-funnel"></i> Bộ lọc
                </button>
            </div>

            <!-- Bo loc -->
            <div class="col-lg-3">
                <div class="collapse d-lg-block" id="filterPanel">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-1">
                                <h5 class="card-title fw-bold mb-0">BỘ LỌC</h5>
                                <span class="filter-state-badge" th:if="${activeFilterCount != null and activeFilterCount > 0}" th:text="'Đang áp dụng ' + ${activeFilterCount} + ' bộ lọc'"></span>
                            </div>
                            <form id="filterForm" th:action="@{/products}" method="get">
                                <input type="hidden" name="promotion" th:if="${promotion}" th:value="${promotion}">
                                <div class="mb-3">
                                    <label class="form-label fw-bold" for="keyword-filter">Từ khóa (mã/tên)</label>
                                    <input type="search" id="keyword-filter" class="form-control form-control-sm" name="keyword" th:value="${keyword}" placeholder="Nhập tên hoặc mã...">
                                </div>

                                <div class="mb-4">
                                    <h6 class="fw-bold mb-2">Thương hiệu</h6>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="categoryId" id="cat-all" value="" th:checked="${categoryId == null}">
                                        <label class="form-check-label" for="cat-all">Tất cả</label>
                                    </div>
                                    <div class="form-check" th:each="cat : ${categories}">
                                        <input class="form-check-input" type="radio" name="categoryId" th:id="|cat-${cat.id}|" th:value="${cat.id}" th:checked="${categoryId == cat.id}">
                                        <label class="form-check-label" th:for="|cat-${cat.id}|" th:text="${cat.name}">Category</label>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label" for="sole-filter">Đế giày</label><select id="sole-filter" class="form-select mb-3" name="soleId"><option value="">Tất cả đế giày</option><option th:each="s:${soles}" th:value="${s.id}" th:text="${s.name}" th:selected="${soleId==s.id}"></option></select>
                                    <label class="form-label" for="material-filter">Chất liệu</label><select id="material-filter" class="form-select mb-3" name="materialId"><option value="">Tất cả chất liệu</option><option th:each="m:${materials}" th:value="${m.id}" th:selected="${materialId==m.id}" th:text="${m.name}"></option></select>
                                    <h6 class="fw-bold mb-2">Kích cỡ</h6>
                                    <div class="d-flex flex-wrap gap-2">
                                        <th:block th:each="sz : ${sizes}">
                                            <input type="radio" class="btn-check" name="sizeId" th:id="|sz-${sz.id}|" th:value="${sz.id}" th:checked="${sizeId == sz.id}">
                                            <label class="btn btn-outline-secondary btn-sm" th:for="|sz-${sz.id}|" th:text="${sz.sizeValue}">39</label>
                                        </th:block>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <h6 class="fw-bold mb-2">Khoảng giá (VNĐ)</h6>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="number" min="0" class="form-control form-control-sm" name="minPrice" placeholder="Từ" th:value="${minPrice}">
                                        </div>
                                        <div class="col-6">
                                            <input type="number" min="0" class="form-control form-control-sm" name="maxPrice" placeholder="Đến" th:value="${maxPrice}">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm w-100 mt-2">ÁP DỤNG</button>
                                </div>

                                <input type="hidden" name="sort" id="sortInput" th:value="${sort}">
                                <a th:href="@{/products}" class="btn btn-link btn-sm w-100">Xóa bộ lọc</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Danh sach -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h4 class="fw-bold mb-0">
                        <span th:if="${keyword != null and !#strings.isEmpty(keyword)}" th:text="|Kết quả tìm kiếm cho: ${keyword}|"></span>
                        <span th:if="${(keyword == null or #strings.isEmpty(keyword)) and promotion != null and promotion}">Sản phẩm khuyến mãi</span>
                        <span th:if="${(keyword == null or #strings.isEmpty(keyword)) and (promotion == null or !promotion)}">Tất cả sản phẩm</span>
                        <small class="text-muted fs-6" th:text="|(${productPage.totalElements} sản phẩm)|"></small>
                    </h4>
                    <div class="d-flex align-items-center">
                        <label class="me-2 fw-bold text-nowrap" for="sortSelect">Sắp xếp:</label>
                        <select id="sortSelect" class="form-select form-select-sm w-auto">
                            <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                            <option value="best_seller" th:selected="${sort == 'best_seller'}">Bán chạy</option>
                            <option value="price_asc" th:selected="${sort == 'price_asc'}">Giá tăng dần</option>
                            <option value="price_desc" th:selected="${sort == 'price_desc'}">Giá giảm dần</option>
                        </select>
                    </div>
                </div>

                <div class="text-center py-5" th:if="${productPage.isEmpty()}">
                    <i class="bi bi-box-seam display-1 text-muted"></i>
                    <h4 class="mt-3">Không tìm thấy sản phẩm nào!</h4>
                    <p class="text-muted">Vui lòng thử bộ lọc hoặc từ khóa khác.</p>
                    <a th:href="@{/products}" class="btn btn-primary">Xóa bộ lọc</a>
                </div>

                <div class="row g-4" th:unless="${productPage.isEmpty()}">
                    <div class="col-6 col-md-4" th:each="p : ${productPage.content}">
                        <div th:replace="~{user/fragments/the-san-pham :: card(${p})}"></div>
                    </div>
                </div>

                <!-- Phan trang: chi hien khi > 1 trang; giu nguyen bo loc + sort -->
<nav th:replace="~{fragments/phan-trang :: phan-trang(${productPage},'page')}"></nav>
            </div>
        </div>
    </div>
</body>
</html>
