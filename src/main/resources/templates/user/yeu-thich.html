<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}"><body><div th:fragment="content" class="container my-4">
<h1>Sản phẩm yêu thích</h1><form action="/favorites" method="get" class="filter-bar mb-4" novalidate><div><label for="favorite-keyword">Từ khóa</label><input class="form-control" id="favorite-keyword" name="keyword" th:value="${keyword}" placeholder="Tên hoặc mã sản phẩm"></div><div><label for="favorite-brand">Thương hiệu</label><select id="favorite-brand" name="categoryId" class="form-select"><option value="">Tất cả thương hiệu</option><option th:each="b:${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${categoryId==b.id}"></option></select></div><button type="submit" class="btn btn-primary">Lọc</button><a class="btn btn-outline-secondary" href="/favorites">Xóa lọc</a></form>
<p th:if="${favoritePage.empty}" class="sales-empty">Chưa có sản phẩm yêu thích phù hợp.</p><div class="row g-3"><div class="col-6 col-md-4 col-lg-3" th:each="f:${favoritePage.content}"><th:block th:if="${favoriteCards.containsKey(f.productId)}"><th:block th:replace="~{user/fragments/the-san-pham :: card(${favoriteCards[f.productId]})}"></th:block></th:block><article th:unless="${favoriteCards.containsKey(f.productId)}" class="card h-100 product-card"><img class="product-image card-img-top" th:with="image=${@productImageUrl.source(f.product.imageUrl)}" th:src="${image}" th:alt="${f.product.name}"><div class="card-body"><small th:text="${f.product.code}"></small><h2 class="h6" th:text="${f.product.name}"></h2><span class="badge bg-secondary" th:text="${f.product.status==true?'Chưa có biến thể đang bán':'Ngừng bán'}"></span><th:block th:replace="~{fragments/yeu-thich-danh-gia :: heart(${f.productId})}"></th:block><th:block th:replace="~{fragments/yeu-thich-danh-gia :: score(${f.productId})}"></th:block></div></article></div></div>
<nav th:replace="~{fragments/phan-trang :: phan-trang(${favoritePage},'page')}"></nav></div></body></html>
