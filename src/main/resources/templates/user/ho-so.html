<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}">
<head>
    <title>Hồ Sơ | F6S Store</title>
</head>
<body>
<div th:fragment="content" class="px-0">
    <div class="container my-5">
        <h3 class="fw-bold mb-4"><i class="bi bi-person-lines-fill text-primary"></i> Hồ Sơ Của Tôi</h3>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Thông Tin Cá Nhân</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/profile/update" method="post" data-user-form novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ và tên</label>
                                <input type="text" class="form-control" name="fullName" th:value="${customer?.fullName}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="text" class="form-control" name="phone" th:value="${customer?.phone}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Thư điện tử</label>
                                <input type="email" class="form-control" name="email" th:value="${customer?.email}" required>
                            </div>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill">Lưu Thông Tin</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Đổi Mật Khẩu</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/profile/change-password" method="post" data-user-form novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu cũ</label>
                                <input type="password" autocomplete="current-password" class="form-control" name="oldPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới</label>
                                <input type="password" autocomplete="new-password" class="form-control" name="newPassword" minlength="8" maxlength="72" required><p class="form-text">Ít nhất 8 ký tự, có chữ và số; tối đa 72 byte UTF-8.</p>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                                <input type="password" autocomplete="new-password" class="form-control" name="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-danger px-4 rounded-pill">Đổi Mật Khẩu</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <section class="card shadow-sm border-0 mt-4" aria-labelledby="address-book-title">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><h4 id="address-book-title">Địa chỉ nhận hàng</h4><a th:if="${shippingAddresses.size()<3}" class="btn btn-outline-primary" data-address-create th:href="@{/profile(newAddress=true)}">Thêm địa chỉ</a></div>
                <p th:if="${shippingAddresses.size()>=3}" class="text-muted" role="status" th:text="${addressLimit}"></p>
                <p th:if="${shippingAddresses.empty}" class="text-muted">Bạn chưa lưu địa chỉ nhận hàng. Thêm địa chỉ để chọn nhanh khi thanh toán.</p>
                <form th:if="${!shippingAddresses.empty}" method="get" th:action="@{/profile}" class="mb-3" novalidate data-address-selector>
                    <label class="form-label" for="profile-address">Chọn địa chỉ để xem hoặc sửa</label>
                    <select id="profile-address" name="addressId" class="form-select" th:data-selected="${shippingAddress.id}">
                        <option value="" th:if="${shippingAddress.id==null}" selected>Đang thêm địa chỉ mới</option>
                        <option th:each="a:${shippingAddresses}" th:value="${a.id}" th:selected="${a.id==shippingAddress.id}" th:text="${a.slot}+'. '+${a.receiverName}+' — '+${a.fullAddress}+(${a.defaultAddress} ? ' · Mặc định' : '')"></option>
                    </select><button type="submit" class="btn btn-outline-secondary mt-2">Xem địa chỉ</button>
                </form>
                <form th:if="${shippingAddress.id!=null or shippingAddresses.size()<3}" th:action="@{/profile/addresses/save}" method="post" th:object="${shippingAddress}" data-user-form data-address-form novalidate>
                    <input type="hidden" th:field="*{id}">
                    <p class="text-danger" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></p>
                    <div class="mb-3"><label class="form-label" for="address-receiver">Tên người nhận</label><input id="address-receiver" class="form-control" type="text" th:field="*{receiverName}" required maxlength="100" aria-describedby="address-receiver-error" th:attr="aria-invalid=${#fields.hasErrors('receiverName')}"><p class="user-message" id="address-receiver-error" aria-live="polite"><span th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></span></p></div>
                    <div class="mb-3"><label class="form-label" for="address-phone">Số điện thoại</label><input id="address-phone" class="form-control" type="tel" th:field="*{phone}" required maxlength="20" pattern="(?:0[0-9]{9}|\+84[0-9]{9})" aria-describedby="address-phone-error" th:attr="aria-invalid=${#fields.hasErrors('phone')}"><p class="user-message" id="address-phone-error" aria-live="polite"><span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span></p></div>
                    <div th:replace="~{fragments/dia-chi-giao-hang :: address('address','address-text','USER',false)}"></div>
                    <div class="form-check mb-3"><input class="form-check-input" id="address-default" type="checkbox" th:field="*{makeDefault}"><label class="form-check-label" for="address-default">Đặt làm mặc định</label></div>
                    <button type="submit" class="btn btn-primary" th:text="${shippingAddress.id==null ? 'Lưu địa chỉ mới' : 'Lưu sửa địa chỉ'}"></button>
                </form>
                <div th:if="${shippingAddress.id!=null}" class="d-flex flex-wrap gap-2 mt-3">
                    <form th:action="@{/profile/addresses/{id}/default(id=${shippingAddress.id})}" method="post" novalidate><button class="btn btn-outline-primary" type="submit">Đặt làm mặc định</button></form>
                    <form th:action="@{/profile/addresses/{id}/delete(id=${shippingAddress.id})}" method="post" data-address-delete novalidate><button class="btn btn-outline-danger" type="submit">Xóa địa chỉ</button></form>
                </div>
            </div>
        </section>
        <script src="/js/dia-chi-nhan-hang.js" defer></script>
    </div>
</div>
</body>
</html>
