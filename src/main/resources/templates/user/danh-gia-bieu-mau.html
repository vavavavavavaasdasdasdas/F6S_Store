<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}"><body><div th:fragment="content" class="container my-4">
<h1 th:text="${reviewForm.id==null?'Đánh giá sản phẩm':'Sửa đánh giá'}"></h1><h2 class="h5" th:text="${reviewProduct.name}"></h2><p class="text-muted">Chỉ khách đã nhận hàng được đánh giá. Mỗi khách một đánh giá cho mỗi sản phẩm; tối đa 5 lần gửi hoặc sửa trong một phút.</p>
<form th:action="@{/reviews/products/{id}(id=${reviewProduct.id})}" th:object="${reviewForm}" method="post" data-user-form novalidate class="admin-panel">
<input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{orderId}">
<label for="stars">Số sao *</label><select id="stars" th:field="*{stars}" class="form-select" required aria-describedby="stars-error"><option value="">Chọn số sao</option><option th:each="n:${#numbers.sequence(5,1)}" th:value="${n}" th:text="${n}+' sao'"></option></select><p id="stars-error" class="field-error" th:errors="*{stars}"></p>
<label for="content" class="mt-3">Nội dung đánh giá</label><textarea id="content" th:field="*{content}" class="form-control resize-none" maxlength="1000" rows="5" aria-describedby="content-error"></textarea><p id="content-error" class="field-error" th:errors="*{content}"></p><p class="form-message" role="alert" hidden></p>
<div class="d-flex gap-2 flex-wrap mt-3"><button class="btn btn-primary" type="submit">Lưu đánh giá</button><a class="btn btn-outline-secondary" th:if="${reviewProduct.status==true}" th:href="@{/products/{id}(id=${reviewProduct.id})}">Xem sản phẩm</a><a href="/orders" class="btn btn-outline-secondary">Đơn hàng của tôi</a></div></form>
<form th:if="${reviewForm.id!=null}" method="post" th:action="@{/reviews/{id}/delete(id=${reviewForm.id})}" class="mt-3" novalidate><input type="hidden" name="productId" th:value="${reviewProduct.id}"><button class="btn btn-outline-danger" type="submit" data-confirm data-confirm-title="Xóa đánh giá" data-confirm-message="Bạn muốn xóa đánh giá của mình?">Xóa đánh giá</button></form>
</div></body></html>
