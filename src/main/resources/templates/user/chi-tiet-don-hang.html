<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}"><body><div th:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h2>Chi tiết Đơn Hàng <span class="text-primary" th:text="${order.orderCode}"></span></h2>
        <a href="/orders" class="btn btn-outline-secondary">Quay lại danh sách</a>
    </div>

<th:block th:replace="~{fragments/han-chuyen-khoan :: deadline(${order},false)}"></th:block>
    <th:block th:replace="~{fragments/giao-hang :: tracking(${order})}"></th:block><th:block th:replace="~{fragments/giao-hang :: estimate(${order},false)}"></th:block><th:block th:replace="~{fragments/phi-giao-hang :: summary(${order})}"></th:block><a class="btn btn-primary mb-3" th:if="${invoice!=null}" th:href="@{/orders/{id}/hoa-don(id=${order.id})}">Xem hóa đơn</a>
    <div class="row">
        <div class="col-md-4">
            <div class="p-3 border rounded bg-light shadow-sm">
                <h5>Thông tin nhận hàng</h5>
                <p class="mb-1"><strong>Người nhận:</strong> <span th:text="${order.receiverName}"></span></p>
                <p class="mb-1"><strong>SĐT:</strong> <span th:text="${order.phoneNumber}"></span></p>
                <p class="mb-1"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
                <hr>
                <p class="mb-1"><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p class="mb-1"><strong>Trạng thái:</strong> <span class="badge bg-primary" th:text="${statusLabels[order.status] ?: order.status}"></span></p>
            </div>
        </div>

        <div class="col-md-8">
            <div class="p-3 border rounded shadow-sm bg-white">
                <h5>Sản phẩm đã mua</h5>
                <form th:if="${canCancel}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" class="mb-3" data-cancel-order><button type="submit" class="btn btn-outline-danger" data-confirm data-confirm-title="Hủy đơn hàng" data-confirm-message="Bạn muốn hủy đơn hàng này? Hàng đã trừ sẽ được hoàn kho.">Hủy đơn hàng</button></form>
                <div class="table-responsive" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><th:block th:replace="~{fragments/vietqr :: payment(${order})}"></th:block><table data-table-key="user-chi-tiet-don-hang-1" class="table mt-3 data-table">
                    <thead>
                        <tr><th scope="col" class="row-number">STT</th>
                            <th>Ảnh</th><th>Mã</th><th>Tên sản phẩm</th>
                            <th>Kích cỡ</th><th>Chất liệu</th><th>Màu sắc</th><th>Đế giày</th>
                            <th>Số lượng</th>
                            <th>Đơn giá</th>
                            <th class="text-end">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detail, rowIndex : ${orderDetails}"><td class="row-number" th:text="${rowIndex.count}"></td>
                            <td><img class="product-thumbnail" th:with="resolvedImage=${@productImageUrl.source(detail.productVariant.product.displayImageUrl)}" th:src="${resolvedImage}" th:alt="${detail.productName}+' — ảnh chính'" width="56" height="56"></td><td th:text="${detail.productVariant.product.code}"></td><td><span th:text="${detail.productName != null ? detail.productName : detail.productVariant.product.name}"></span></td>
                            <td th:text="${detail.sizeName != null ? detail.sizeName : detail.productVariant.size.sizeValue}"></td>
                            <td th:text="${detail.displayMaterialName}"></td><td th:text="${detail.displayColorName}"></td><td th:text="${detail.displaySoleName}"></td><td th:text="${detail.quantity}"></td>
                            <td th:text="${@money.format(detail.price)} + ' đ'"></td>
                            <td class="text-end fw-bold" th:text="${@money.format(detail.totalPrice)} + ' đ'"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="10" class="text-end fw-bold">Tổng cộng:</td>
                            <td class="text-end fw-bold text-danger fs-5" th:text="${@money.format(order.finalAmount)} + ' đ'"></td>
                        </tr>
                    </tfoot>
                </table></div>
            </div>
        </div>
    </div>
</div>
</body></html>
