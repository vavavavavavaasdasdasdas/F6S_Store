<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}"><head><title>Đặt hàng thành công</title></head><body><div th:fragment="content" class="container my-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><h2 class="text-success fw-bold">Đặt hàng thành công</h2><p>Cảm ơn bạn đã mua sắm tại SHOP GIÀY.</p><th:block th:replace="~{fragments/vietqr :: payment(${order})}"></th:block><div class="card my-4"><div class="card-body p-4"><h5 th:text="'Đơn hàng '+${order.orderCode}"></h5><div class="data-table-scroll" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="user-dat-hang-thanh-cong-1" class="table align-middle data-table" ><thead><tr><th scope="col">STT</th><th scope="col">Mã</th><th scope="col">Tên sản phẩm</th><th scope="col">Kích cỡ</th><th scope="col">Chất liệu</th><th>Màu sắc</th><th>Đế giày</th><th scope="col">Số lượng</th><th scope="col">Đơn giá</th><th scope="col">Thành tiền</th></tr></thead><tbody><tr th:each="d,rowIndex:${order.orderDetails}"><td class="row-number" th:text="${rowIndex.count}"></td><td th:text="${d.productVariant.product.code}"></td><td th:text="${d.productName}"></td><td th:text="${d.sizeName}"></td><td th:text="${d.displayMaterialName}"></td><td th:text="${d.displayColorName}"></td><td th:text="${d.displaySoleName}"></td><td th:text="${d.quantity}"></td><td th:text="${@money.format(d.price)+' đ'}"></td><td th:text="${@money.format(d.totalPrice)+' đ'}"></td></tr></tbody></table></div><th:block th:replace="~{fragments/han-chuyen-khoan :: deadline(${order},false)}"></th:block>
<dl class="row"><dt class="col-5">Người nhận</dt><dd class="col-7" th:text="${order.receiverName}"></dd><dt class="col-5">Số điện thoại</dt><dd class="col-7" th:text="${order.phoneNumber}"></dd><dt class="col-5">Địa chỉ</dt><dd class="col-7" th:text="${order.shippingAddress}"></dd><dt class="col-5">Tạm tính</dt><dd class="col-7" th:text="${@money.format(order.totalAmount)}+' đ'"></dd><dt class="col-5">Giảm phiếu giảm giá</dt><dd class="col-7" th:text="${@money.format(order.discountAmount ?: 0)}+' đ'"></dd><dt class="col-5">Phí giao hàng</dt><dd class="col-7" th:text="${@money.format(order.shippingFee ?: 0)}+' đ'"></dd><dt class="col-5">Tổng tiền</dt><dd class="col-7 text-danger fw-bold" th:text="${@money.format(order.finalAmount)}+' đ'"></dd><dt class="col-5">Thanh toán</dt><dd class="col-7" th:text="${order.paymentMethod=='COD' ? 'Khi nhận hàng (COD)' : 'Chuyển khoản ngân hàng'}"></dd><dt class="col-5">Trạng thái</dt><dd class="col-7" th:text="${order.paymentStatus=='PAID' ? 'Đã thanh toán' : 'Chưa thanh toán'}"></dd></dl></div></div><div class="d-flex gap-3 flex-wrap"><a href="/products" class="btn btn-outline-primary">Tiếp tục mua sắm</a><a class="btn btn-primary" th:href="@{/orders/{id}(id=${order.id})}">Xem đơn hàng</a></div></div></div></div></body></html>
