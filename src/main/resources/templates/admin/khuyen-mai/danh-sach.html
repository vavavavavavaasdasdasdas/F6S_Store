<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><span class="eyebrow">KHUYẾN MÃI</span><h1>Đợt giảm giá</h1><p class="admin-description">Chỉ áp dụng khi hoạt động và trong thời gian hiệu lực.</p></div><a class="btn btn-primary" href="/admin/promotions/create">Thêm đợt giảm giá</a></div><div class="admin-panel">
<form class="catalog-filters mb-3" method="get" action="/admin/promotions" novalidate>
<div><label for="keyword">Từ khóa</label><div class="search-control"><input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Tên đợt giảm giá" maxlength="100"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div>
<div><label for="promotion-state">Trạng thái</label><select class="form-select" id="promotion-state" name="state"><option value="">Tất cả trạng thái</option><option value="RUNNING" th:selected="${state=='RUNNING'}">Đang chạy</option><option value="UPCOMING" th:selected="${state=='UPCOMING'}">Sắp tới</option><option value="EXPIRED" th:selected="${state=='EXPIRED'}">Hết hạn</option><option value="INACTIVE" th:selected="${state=='INACTIVE'}">Đã khóa</option></select></div>
<div><label for="promotion-from">Từ ngày</label><input class="form-control" type="date" id="promotion-from" name="from" th:value="${from}"></div>
<div><label for="promotion-to">Đến ngày</label><input class="form-control" type="date" id="promotion-to" name="to" th:value="${to}"></div>
<div class="filter-actions"><button class="btn btn-outline-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" href="/admin/promotions">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</form>
<div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-khuyen-mai-danh-sach-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Tên</th><th>Loại giảm</th><th>Giá trị giảm</th><th>Bắt đầu</th><th>Kết thúc</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody><tr th:each="p, rowIndex :${promotions}"><td class="row-number" th:text="${dataPage.number * dataPage.size + rowIndex.count}"></td><td class="catalog-name" th:text="${p.name}"></td><td th:text="${p.discountType=='PERCENT' ? 'Phần trăm (%)' : 'Số tiền (đ)'}"></td><td th:text="${p.discountValue}"></td><td><span class="people-contact" th:text="${#temporals.format(p.startDate,'dd/MM/yyyy HH:mm')}"></span></td><td><span class="people-contact" th:text="${#temporals.format(p.endDate,'dd/MM/yyyy HH:mm')}"></span></td><td th:text="${p.status==true ? 'Hoạt động' : 'Đã khóa'}"></td><td><div class="catalog-actions"><a th:href="@{/admin/promotions/edit/{id}(id=${p.id})}">Sửa</a><a th:href="@{/admin/promotions/{id}/products(id=${p.id})}">Chọn sản phẩm</a><form method="post" novalidate th:action="@{/admin/promotions/delete/{id}(id=${p.id})}"><button type="button" class="btn btn-outline-danger btn-sm" data-delete th:data-object="${p.name}" data-consequence="Sản phẩm trở về giá áp dụng còn lại. Giá đơn đã đặt không thay đổi.">Xóa</button></form></div></td></tr><tr th:if="${#lists.isEmpty(promotions)}"><td colspan="8" class="catalog-empty">Chưa có dữ liệu. Thêm chương trình đầu tiên để bắt đầu.</td></tr></tbody></table></div></div><nav th:replace="~{fragments/phan-trang :: phan-trang(${dataPage},'page')}"></nav></section></body></html>
