<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><span class="eyebrow">SẢN PHẨM ÁP DỤNG</span><h1 th:text="${promotion.name}"></h1><p class="admin-description">Chọn nhiều sản phẩm. Tìm kiếm trên toàn bộ sản phẩm. Lưu lựa chọn của trang hiện tại trước khi chuyển trang; các trang khác được giữ nguyên.</p></div><a class="btn btn-outline-secondary" href="/admin/promotions">Quay lại danh sách</a></div>
<form id="promotion-filter" method="get"><input type="hidden" name="page" value="0"></form><form class="admin-panel" method="post" th:action="@{/admin/promotions/{id}/products(id=${promotion.id})}" data-admin-form novalidate><p class="form-message" hidden role="alert"></p>
<div class="catalog-filters"><div><label for="product-search">Tìm sản phẩm theo tên hoặc mã</label><div class="search-control"><input class="form-control" id="product-search" type="search" name="q" form="promotion-filter" th:value="${q}"><button class="search-clear" aria-label="Tìm sản phẩm" form="promotion-filter" type="submit">Tìm</button></div></div></div>
<input type="hidden" name="page" th:value="${productPage.number}"><input type="hidden" name="q" th:value="${q}"><p data-selection-count role="status"></p><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-khuyen-mai-san-pham-ap-dung-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Áp dụng</th><th>Mã</th><th>Sản phẩm</th><th>Trạng thái</th></tr></thead><tbody>
<tr th:each="p, rowIndex :${products}" data-product-row th:data-search="${p.name}+' '+${p.code}"><td class="row-number" th:text="${productPage.number * productPage.size + rowIndex.count}"></td><td><input type="hidden" name="visibleIds" th:value="${p.id}"><input class="form-check-input" type="checkbox" name="productIds" th:value="${p.id}" th:id="'product-'+${p.id}" th:checked="${selected.contains(p.id)}"></td><td th:text="${p.code}"></td><td><label th:for="'product-'+${p.id}" th:text="${p.name}"></label></td><td th:text="${p.status==true ? 'Đang bán' : 'Ngừng bán'}"></td></tr>
<tr th:if="${productPage.empty}" data-products-empty><td colspan="5" class="catalog-empty">Không tìm thấy sản phẩm. Thử từ khóa khác.</td></tr></tbody></table></div><div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu sản phẩm áp dụng</button><a th:href="@{/admin/promotions/edit/{id}(id=${promotion.id})}" class="btn btn-outline-secondary">Sửa chương trình</a></div></form><script src="/js/quan-tri-giam-gia.js" defer></script><nav th:replace="~{fragments/phan-trang :: phan-trang(${productPage},'page')}"></nav></section></body></html>
