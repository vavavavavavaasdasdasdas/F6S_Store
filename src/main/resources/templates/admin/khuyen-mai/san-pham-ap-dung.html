<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><h1 th:text="${promotion.name}"></h1></div><a class="btn btn-outline-secondary" href="/admin/promotions">Quay lại danh sách</a></div>
<form id="promotion-filter" method="get" th:action="@{/admin/promotions/{id}/products(id=${promotion.id})}"><input type="hidden" name="page" value="0"></form><form class="admin-panel" method="post" th:action="@{/admin/promotions/{id}/products(id=${promotion.id})}" data-admin-form data-promotion-selection th:data-promotion-id="${promotion.id}" th:data-selection-saved="${selectionSaved==true}" novalidate><p class="form-message" hidden role="alert"></p>
<div class="catalog-filters mb-3">
<div><label for="product-search">Từ khóa biến thể</label><div class="search-control"><input class="form-control" id="product-search" type="search" name="q" form="promotion-filter" th:value="${q}" placeholder="Tên SP, mã biến thể, màu, size..."></div></div>
<div><label for="promo-categoryId">Thương hiệu</label><select class="form-select" id="promo-categoryId" name="categoryId" form="promotion-filter"><option value="">Tất cả thương hiệu</option><option th:each="c:${categories}" th:value="${c.id}" th:selected="${categoryId==c.id}" th:text="${c.name}"></option></select></div>
<div><label for="promo-applied">Trạng thái chọn</label><select class="form-select" id="promo-applied" name="applied" form="promotion-filter"><option value="">Tất cả biến thể</option><option value="true" th:selected="${applied==true}">Đã chọn</option><option value="false" th:selected="${applied==false}">Chưa chọn</option></select></div>
<div class="filter-actions"><button class="btn btn-outline-primary" form="promotion-filter" type="submit">Lọc</button><a class="btn btn-outline-secondary" th:href="@{/admin/promotions/{id}/products(id=${promotion.id})}">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</div>
<input type="hidden" name="page" th:value="${productPage.number}"><input type="hidden" name="q" th:value="${q}"><input type="hidden" name="categoryId" th:if="${categoryId!=null}" th:value="${categoryId}"><input type="hidden" name="applied" th:if="${applied!=null}" th:value="${applied}"><div class="catalog-actions mb-3"><button class="btn btn-outline-primary" type="button" data-selection-all="true">Bật tất cả trên trang</button><button class="btn btn-outline-secondary" type="button" data-selection-all="false">Tắt tất cả trên trang</button></div><p data-selection-count role="status"></p><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-khuyen-mai-san-pham-ap-dung-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã biến thể</th><th>Áp dụng</th><th>Tên sản phẩm</th><th>Màu sắc</th><th>Kích cỡ</th><th>Giá bán</th></tr></thead><tbody>
<tr th:each="v, rowIndex :${products}" data-product-row th:data-search="${v.product.name}+' '+${v.ma}+' '+${v.product.code}+' '+${v.color.name}+' '+${v.size.sizeValue}"><td class="row-number" th:text="${productPage.number * productPage.size + rowIndex.count}"></td><td th:text="${v.ma}"></td><td><input type="hidden" name="visibleIds" th:value="${v.id}"><label class="discount-switch"><input class="form-check-input" role="switch" aria-label="Áp dụng biến thể" type="checkbox" name="productIds" th:value="${v.id}" th:id="'variant-'+${v.id}" th:checked="${selected.contains(v.id)}"><span class="discount-switch-track" aria-hidden="true"></span></label></td><td><label th:for="'variant-'+${v.id}" th:text="${v.product.name}"></label></td><td th:text="${v.color.name}"></td><td th:text="${v.size.sizeValue}"></td><td th:text="${@money.format(v.price)} + ' đ'"></td></tr>
<tr th:if="${productPage.empty}" data-products-empty><td colspan="7" class="catalog-empty">Không tìm thấy biến thể sản phẩm. Thử từ khóa khác.</td></tr></tbody></table></div><div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu thay đổi</button><a th:href="@{/admin/promotions/edit/{id}(id=${promotion.id})}" class="btn btn-outline-secondary">Sửa chương trình</a></div></form><script src="/js/quan-tri-giam-gia.js" defer></script><nav th:replace="~{fragments/phan-trang :: phan-trang(${productPage},'page')}"></nav></section></body></html>
