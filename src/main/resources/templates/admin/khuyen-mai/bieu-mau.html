<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><h1 th:text="${promotion.id==null ? 'Tạo đợt giảm giá' : 'Sửa đợt giảm giá'}"></h1></div></div><form class="admin-panel catalog-form" data-admin-form data-discount-form="promotion" novalidate method="post" th:action="@{/admin/promotions/save}" th:object="${promotion}"><input type="hidden" th:field="*{id}"><div class="catalog-field"><label for="object-code">Mã đợt giảm giá</label><input id="object-code" class="form-control" readonly th:value="${promotion.code}" placeholder="Tự động tạo khi lưu (VD: KM001)"></div><p class="form-message" hidden role="alert"></p><div class="catalog-form-grid"><div class="catalog-field"><label for="name">Tên đợt giảm giá *</label><input class="form-control" id="name" type="text" th:field="*{name}" required maxlength="100" aria-describedby="name-error"><p class="field-error" id="name-error" aria-live="polite"><span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></p></div>
<div class="catalog-field"><label for="discountType">Loại giảm</label><select class="form-select" id="discountType" th:field="*{discountType}" required><option value="PERCENT">Phần trăm</option><option value="AMOUNT">Số tiền đồng</option></select><p class="field-error" th:errors="*{discountType}" id="discountType-error"></p></div><div class="catalog-field"><label for="discountValue">Giá trị giảm *</label><input class="form-control" id="discountValue" type="number" th:field="*{discountValue}" required min="1" max="100" step="1" aria-describedby="discountValue-error"><p class="field-error" id="discountValue-error" aria-live="polite"><span th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></span></p></div>
<div class="catalog-field"><label for="startDate">Bắt đầu *</label><input class="form-control" id="startDate" type="datetime-local" step="any" th:field="*{startDate}" required aria-describedby="startDate-error"><p class="field-error" id="startDate-error" aria-live="polite"><span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span></p></div>
<div class="catalog-field"><label for="endDate">Kết thúc *</label><input class="form-control" id="endDate" type="datetime-local" step="any" th:field="*{endDate}" required aria-describedby="endDate-error"><p class="field-error" id="endDate-error" aria-live="polite"><span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span></p></div>
<div class="catalog-field"><label class="discount-switch" for="status"><input type="checkbox" role="switch" id="status" th:field="*{status}"><span class="discount-switch-track" aria-hidden="true"></span><span>Hoạt động</span></label></div>
</div><div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu và chọn sản phẩm</button><a class="btn btn-outline-secondary" href="/admin/promotions">Quay lại danh sách</a></div></form><script src="/js/quan-tri-giam-gia.js" defer></script></section></body></html>
