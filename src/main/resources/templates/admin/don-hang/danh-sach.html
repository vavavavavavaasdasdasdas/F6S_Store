<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>

<div class="admin-heading"><div><span class="eyebrow">BÁN HÀNG</span><h1>Đơn hàng</h1><p class="admin-description">Theo dõi đơn trực tuyến và POS trong một danh sách.</p></div><a class="btn btn-primary" href="/admin/pos">Bán tại quầy</a></div><div class="admin-panel"><form class="sales-filters" action="/admin/orders" method="get" novalidate><div><label for="q">Mã đơn</label><input class="form-control" id="q" type="search" name="q" th:value="${q}"></div><div><label for="status">Trạng thái</label><select class="form-select" id="status" name="status"><option value="">Tất cả</option><option th:each="s:${statusLabels}" th:value="${s.key}" th:text="${s.value}" th:selected="${status==s.key}"></option></select></div><button class="btn btn-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" href="/admin/orders">Xóa lọc</a></form><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-don-hang-danh-sach-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã đơn</th><th>Kênh</th><th>Khách</th><th>Trạng thái</th><th>Thanh toán</th><th class="money">Tổng (đ)</th><th>Ngày tạo</th></tr></thead><tbody><tr th:each="o, rowIndex :${orders.content}"><td class="row-number" th:text="${orders.number * orders.size + rowIndex.count}"></td><td><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${o.orderCode}"></a></td><td th:text="${o.orderType=='POS'?'Tại quầy':'Trực tuyến'}"></td><td th:text="${o.customer!=null?o.customer.fullName:o.receiverName!=null?o.receiverName:'Khách lẻ'}"></td><td><span class="status-pill" th:data-status="${o.status}" th:text="${statusLabels[o.status] ?: o.status}"></span></td><td th:text="${o.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></td><td class="money" th:text="${@money.format(o.finalAmount)}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${orders.empty}"><td colspan="8" class="sales-empty">Không có đơn phù hợp.</td></tr></tbody></table></div></div>
<nav th:replace="~{fragments/phan-trang :: phan-trang(${orders},'page')}"></nav></section></body></html>
