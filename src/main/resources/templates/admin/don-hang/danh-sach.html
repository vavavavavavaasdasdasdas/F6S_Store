<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>

<div class="admin-heading"><div><span class="eyebrow">BÁN HÀNG</span><h1>Đơn hàng</h1><p class="admin-description">Theo dõi đơn trực tuyến và POS trong một danh sách.</p></div><a class="btn btn-primary" href="/admin/pos">Bán tại quầy</a></div><div class="admin-panel"><form class="catalog-filters mb-3" action="/admin/orders" method="get" novalidate>
<div><label for="q">Mã đơn</label><input class="form-control" id="q" type="search" name="q" th:value="${q}" placeholder="Nhập mã đơn hàng"></div>
<div><label for="customer">Tìm khách</label><input class="form-control" id="customer" type="search" name="customer" th:value="${customer}" placeholder="Tên, SĐT, mã khách"></div>
<div><label for="order-customerId">Khách hàng</label><select class="form-select" id="order-customerId" name="customerId"><option value="">Tất cả khách hàng</option><option th:each="c:${customers}" th:value="${c.id}" th:selected="${customerId==c.id}" th:text="${c.fullName + (c.phone != null ? ' · ' + c.phone : '')}"></option></select></div>
<div><label for="order-channel">Kênh bán</label><select class="form-select" id="order-channel" name="channel"><option value="">Tất cả kênh</option><option value="ONLINE" th:selected="${channel=='ONLINE'}">Trực tuyến (Online)</option><option value="POS" th:selected="${channel=='POS'}">Tại quầy (POS)</option></select></div>
<div><label for="status">Trạng thái</label><select class="form-select" id="status" name="status"><option value="">Tất cả trạng thái</option><option th:each="s:${statusLabels}" th:value="${s.key}" th:text="${s.value}" th:selected="${status==s.key}"></option></select></div>
<div><label for="paymentStatus">Thanh toán</label><select class="form-select" id="paymentStatus" name="paymentStatus"><option value="">Tất cả thanh toán</option><option value="PAID" th:selected="${paymentStatus=='PAID'}">Đã thanh toán</option><option value="UNPAID" th:selected="${paymentStatus=='UNPAID'}">Chưa thanh toán</option></select></div>
<div><label for="paymentMethod">Phương thức</label><select class="form-select" id="paymentMethod" name="paymentMethod"><option value="">Tất cả phương thức</option><option value="COD" th:selected="${paymentMethod=='COD'}">Thanh toán khi nhận hàng (COD)</option><option value="BANK_TRANSFER" th:selected="${paymentMethod=='BANK_TRANSFER'}">Chuyển khoản (Online)</option><option value="CASH" th:selected="${paymentMethod=='CASH'}">Tiền mặt (POS)</option><option value="TRANSFER" th:selected="${paymentMethod=='TRANSFER'}">Chuyển khoản (POS)</option></select></div>
<div><label for="order-from">Từ ngày</label><input class="form-control" id="order-from" type="date" name="from" th:value="${from}"></div>
<div><label for="order-to">Đến ngày</label><input class="form-control" id="order-to" type="date" name="to" th:value="${to}"></div>
<div class="filter-actions"><button class="btn btn-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" href="/admin/orders">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</form><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-don-hang-danh-sach-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã đơn</th><th>Kênh</th><th>Khách</th><th>Trạng thái</th><th>Thanh toán</th><th class="money">Tổng (đ)</th><th>Ngày tạo</th></tr></thead><tbody><tr th:each="o, rowIndex :${orders.content}"><td class="row-number" th:text="${orders.number * orders.size + rowIndex.count}"></td><td><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${o.orderCode}"></a></td><td th:text="${o.channelLabel}"></td><td th:text="${o.customer!=null?o.customer.fullName:o.receiverName!=null?o.receiverName:'Khách lẻ'}"></td><td><span class="status-pill" th:data-status="${o.status}" th:text="${statusLabels[o.status] ?: o.status}"></span></td><td th:text="${o.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></td><td class="money" th:text="${@money.format(o.finalAmount)}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${orders.empty}"><td colspan="8" class="sales-empty">Không có đơn phù hợp.</td></tr></tbody></table></div></div>
<nav th:replace="~{fragments/phan-trang :: phan-trang(${orders},'page')}"></nav></section></body></html>
