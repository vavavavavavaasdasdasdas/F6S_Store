<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>

<div class="admin-heading"><div><span class="eyebrow">CHI TIẾT ĐƠN HÀNG</span><h1 th:text="${order.orderCode}"></h1><p class="admin-description" th:text="'Tạo lúc '+${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}+' · '+${order.orderType=='POS'?'Tại quầy':'Trực tuyến'}"></p></div><div><a th:if="${invoice!=null}" class="btn btn-primary" th:href="@{/admin/invoices/{id}(id=${invoice.id})}" th:text="'Hóa đơn '+${invoice.invoiceCode}"></a> <a class="btn btn-outline-secondary" href="/admin/orders">Danh sách</a></div></div>
<th:block th:replace="~{fragments/han-chuyen-khoan :: deadline(${order},true)}"></th:block>
<div class="sales-detail-grid"><div class="admin-panel"><div class="panel-heading"><h2>Khách hàng &amp; người bán</h2></div><p>Khách: <strong th:text="${invoice!=null?invoice.customerName:order.customer!=null?order.customer.fullName:order.receiverName ?: 'Khách lẻ'}"></strong></p><p>SĐT: <span th:text="${invoice!=null?invoice.customerPhone:order.phoneNumber} ?: '—'"></span></p><p>Địa chỉ: <span th:text="${order.shippingAddress} ?: '—'"></span></p><p>Nhân viên: <span th:text="${invoice!=null?invoice.employeeName:order.employee!=null?order.employee.fullName:'Đơn trực tuyến'}"></span></p></div>
<div class="admin-panel"><div class="panel-heading"><h2>Xử lý đơn hàng</h2><span class="status-pill" th:data-status="${order.status}" th:text="${statusLabels[order.status] ?: order.status}"></span></div><p>Tồn kho: <strong th:text="${order.daTruKho == true ? 'Đã trừ kho' : 'Chưa trừ kho'}"></strong></p><p>Thanh toán: <strong th:text="${order.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></strong></p>
<form th:if="${order.status!='CANCELLED' && order.status!='DELIVERY_FAILED' && order.paymentStatus!='PAID' && (order.paymentMethod=='TRANSFER' || order.paymentMethod=='BANK_TRANSFER')}" th:action="@{/admin/orders/{id}/confirm-payment(id=${order.id})}" method="post" class="mb-3" novalidate><button type="button" class="btn btn-primary" data-confirm data-confirm-title="Xác nhận thanh toán" data-confirm-message="Đã nhận đủ tiền chuyển khoản của đơn này?">Xác nhận đã nhận chuyển khoản</button></form>
<form th:if="${!allowedStatuses.empty}" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" novalidate><label for="nextStatus">Chuyển trạng thái</label><div class="input-group"><select id="nextStatus" name="status" class="form-select"><option th:each="s:${allowedStatuses}" th:value="${s}" th:text="${statusLabels.get(s)}"></option></select><button type="button" class="btn btn-primary" data-confirm data-confirm-title="Cập nhật trạng thái đơn" data-confirm-message="Hủy hoặc giao thất bại sẽ hoàn hàng nếu đơn đã trừ kho. Tiếp tục?">Cập nhật</button></div></form><p th:if="${allowedStatuses.empty}" class="sales-muted">Đơn đã kết thúc xử lý.</p></div></div>
<div class="admin-panel mt-4"><div class="panel-heading"><h2>Sản phẩm trong đơn</h2></div><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-don-hang-chi-tiet-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã</th><th>Tên sản phẩm</th><th>Kích cỡ</th><th>Chất liệu</th><th>SL</th><th class="money">Đơn giá (đ)</th><th class="money">Thành tiền (đ)</th></tr></thead><tbody><tr th:each="d, rowIndex :${order.orderDetails}"><td class="row-number" th:text="${rowIndex.count}"></td><td th:text="${d.productVariant.product.code}"></td><td th:text="${d.productName!=null?d.productName:d.productVariant.product.name}"></td><td th:text="${d.sizeName!=null?d.sizeName:d.productVariant.size.sizeValue}"></td><td th:text="${d.displayMaterialName}"></td><td th:text="${d.quantity}"></td><td class="money" th:text="${@money.format(d.price)}"></td><td class="money" th:text="${@money.format(d.totalPrice)}"></td></tr></tbody></table></div><dl class="invoice-totals"><dt>Tạm tính</dt><dd th:text="${@money.format(order.totalAmount)}+' đ'"></dd><dt>Giảm giá</dt><dd th:text="${@money.format(order.discountAmount)}+' đ'"></dd><dt>Phí giao hàng</dt><dd th:text="${@money.format(order.shippingFee)}+' đ'"></dd><dt>TỔNG</dt><dd><strong th:text="${@money.format(order.finalAmount)}+' đ'"></strong></dd></dl></div>
</section></body></html>
