<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>

<div class="admin-heading"><div><h1 th:text="${order.orderCode}"></h1></div><div><a th:if="${invoice!=null}" class="btn btn-primary" th:href="@{/admin/invoices/{id}(id=${invoice.id})}" th:text="'Hóa đơn '+${invoice.invoiceCode}"></a> <a class="btn btn-outline-secondary" href="/admin/orders">Danh sách</a></div></div>
<section class="admin-panel mb-3" th:if="${order.orderType=='ONLINE'}"><p th:if="${order.orderSource!=null}">Nguồn đơn: <strong th:text="${order.sourceLabel}"></strong></p><p th:if="${order.salesNote!=null}">Ghi chú: <span th:text="${order.salesNote}"></span></p><button type="button" class="btn btn-outline-primary" data-copy-order-message>Sao chép tin nhắn xác nhận</button><textarea class="resize-none" hidden readonly id="order-confirmation-message" th:text="${confirmationMessage}" aria-label="Nội dung tin nhắn xác nhận"></textarea><p data-copy-message-status role="status" aria-live="polite"></p></section><script src="/js/sao-chep-don-hang.js" defer></script><th:block th:replace="~{fragments/han-chuyen-khoan :: deadline(${order},true)}"></th:block>
<th:block th:replace="~{fragments/vietqr :: payment(${order})}"></th:block><th:block th:replace="~{fragments/giao-hang :: tracking(${order})}"></th:block><th:block th:replace="~{fragments/giao-hang :: estimate(${order},true)}"></th:block><th:block th:replace="~{fragments/phi-giao-hang :: summary(${order})}"></th:block><div class="sales-detail-grid"><div class="admin-panel"><div class="panel-heading"><h2>Khách hàng &amp; người bán</h2></div><p>Khách: <strong th:text="${invoice!=null?invoice.customerName:order.customer!=null?order.customer.fullName:order.receiverName ?: 'Khách lẻ'}"></strong></p><p>SĐT: <span th:text="${invoice!=null?invoice.customerPhone:order.phoneNumber} ?: '—'"></span></p><p>Địa chỉ: <span th:text="${order.shippingAddress} ?: '—'"></span></p><p>Nhân viên: <span th:text="${invoice!=null?invoice.employeeName:order.employee!=null?order.employee.fullName:'Đơn trực tuyến'}"></span></p></div>
<th:block th:replace="~{fragments/xu-ly-don-hang :: panel(${order},${allowedStatuses},${'/admin/orders/'+order.id})}"></th:block></div>
<th:block th:replace="~{fragments/xu-ly-don-hang :: province(${order},${allowedStatuses},${'/admin/orders/'+order.id})}"></th:block>
<th:block th:replace="~{fragments/xu-ly-don-hang :: dialog(${order},${allowedStatuses},${'/admin/orders/'+order.id})}"></th:block>
<div class="admin-panel mt-4"><div class="panel-heading"><h2>Sản phẩm trong đơn</h2></div><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-don-hang-chi-tiet-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã</th><th>Tên sản phẩm</th><th>Kích cỡ</th><th>Chất liệu</th><th>Màu sắc</th><th>Đế giày</th><th>SL</th><th class="money">Đơn giá (đ)</th><th class="money">Thành tiền (đ)</th></tr></thead><tbody><tr th:each="d, rowIndex :${order.orderDetails}"><td class="row-number" th:text="${rowIndex.count}"></td><td th:text="${d.productVariant.product.code}"></td><td th:text="${d.productName!=null?d.productName:d.productVariant.product.name}"></td><td th:text="${d.sizeName!=null?d.sizeName:d.productVariant.size.sizeValue}"></td><td th:text="${d.displayMaterialName}"></td><td th:text="${d.displayColorName}"></td><td th:text="${d.displaySoleName}"></td><td th:text="${d.quantity}"></td><td class="money" th:text="${@money.format(d.price)}"></td><td class="money" th:text="${@money.format(d.totalPrice)}"></td></tr></tbody></table></div><dl class="invoice-totals"><dt>Tạm tính</dt><dd th:text="${@money.format(order.totalAmount)}+' đ'"></dd><dt>Giảm giá</dt><dd th:text="${@money.format(order.discountAmount)}+' đ'"></dd><dt>Phí giao hàng</dt><dd th:text="${@money.format(order.shippingFee)}+' đ'"></dd><dt>TỔNG</dt><dd><strong th:text="${@money.format(order.finalAmount)}+' đ'"></strong></dd></dl></div>
</section></body></html>
