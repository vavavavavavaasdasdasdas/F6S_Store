<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modalTableAndPagination" id="pos-modal-content">
    <div class="data-table-scroll pos-modal-table-wrap">
        <table class="admin-table data-table pos-modal-table" data-table-key="pos-modal-products">
            <thead>
                <tr>
                    <th scope="col" style="width: 45px;" class="text-center">STT</th>
                    <th scope="col" style="width: 90px;">Mã SP</th>
                    <th scope="col">Tên sản phẩm</th>
                    <th scope="col" style="width: 100px;">Màu sắc</th>
                    <th scope="col" style="width: 100px;">Chất liệu</th>
                    <th scope="col" style="width: 100px;">Đế giày</th>
                    <th scope="col" style="width: 75px;" class="text-center">Kích cỡ</th>
                    <th scope="col" style="width: 85px;" class="text-center">Tồn kho</th>
                    <th scope="col" style="width: 130px;">Giá bán</th>
                    <th scope="col" style="width: 130px;">Khuyến mãi</th>
                    <th scope="col" style="width: 70px;" class="text-center">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${isEmpty}">
                    <td colspan="11" class="text-center py-4 text-muted">Không có sản phẩm nào phù hợp với bộ lọc hiện tại.</td>
                </tr>
                <tr th:each="v,iter : ${variants}" class="pos-modal-row" th:data-variant-id="${v.id}">
                    <td class="row-number text-center" th:text="${currentPage * 12 + iter.count}">1</td>
                    <td class="small fw-semibold text-muted" th:text="${v.productCode}">SP001</td>
                    <td>
                        <span class="fw-semibold text-dark" th:text="${v.productName}">Tên sản phẩm</span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span class="pos-color-dot" th:style="'background-color:' + ${v.colorHex}"></span>
                            <span th:text="${v.colorName}">Trắng</span>
                        </div>
                    </td>
                    <td th:text="${v.materialName}">Da</td>
                    <td th:text="${v.soleName}">Cao su</td>
                    <td class="text-center">
                        <span class="badge bg-secondary-subtle text-dark border px-2 py-1" th:text="${v.sizeValue}">40</span>
                    </td>
                    <td class="text-center">
                        <span class="pos-modal-stock-badge badge"
                              th:classappend="${v.availableQuantity <= 0 ? 'bg-secondary' : (v.availableQuantity <= 5 ? 'bg-warning text-dark' : 'bg-light text-dark border')}"
                              th:text="${v.availableQuantity}"
                              th:data-variant-id="${v.id}"
                              th:data-physical="${v.physicalQuantity}">10</span>
                    </td>
                    <td>
                        <div th:if="${v.hasPromotion}">
                            <span class="text-danger fw-bold d-block" th:text="${v.finalPriceFormatted}">400.000 đ</span>
                            <del class="small text-muted" th:text="${v.originalPriceFormatted}">500.000 đ</del>
                            <span class="badge bg-danger ms-1" th:text="${v.discountLabel != null ? v.discountLabel : ('-' + v.discountPercentage + '%')}">-20%</span>
                        </div>
                        <div th:unless="${v.hasPromotion}">
                            <span class="fw-bold text-dark" th:text="${v.finalPriceFormatted}">500.000 đ</span>
                        </div>
                    </td>
                    <td>
                        <span th:if="${v.hasPromotion and v.promotionName != null and v.promotionName != '—'}"
                              class="badge bg-danger-subtle text-danger border border-danger-subtle text-wrap"
                              th:text="${v.promotionName}">Đợt giảm giá</span>
                        <span th:unless="${v.hasPromotion and v.promotionName != null and v.promotionName != '—'}"
                              class="text-muted">—</span>
                    </td>
                    <td class="text-center">
                        <button th:if="${v.availableQuantity > 0}" type="button"
                                class="btn btn-sm btn-primary pos-btn-add-variant px-2 fw-bold"
                                th:data-variant-id="${v.id}"
                                th:data-variant-name="${v.productName + ' (' + v.sizeValue + ' - ' + v.colorName + ')'}"
                                title="Thêm vào giỏ"
                                aria-label="Thêm vào giỏ">
                            +
                        </button>
                        <button th:unless="${v.availableQuantity > 0}" type="button"
                                class="btn btn-sm btn-secondary pos-btn-add-variant px-1"
                                th:data-variant-id="${v.id}"
                                disabled
                                title="Hết hàng"
                                aria-label="Hết hàng">
                            Hết hàng
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Phân trang modal gọn 12 sản phẩm/trang -->
    <div class="d-flex justify-content-between align-items-center pt-3 px-2 border-top" th:if="${totalPages > 1}">
        <span class="small text-muted" th:text="'Trang ' + (${currentPage} + 1) + ' / ' + ${totalPages} + ' (Tổng ' + ${totalElements} + ' biến thể)'">
            Trang 1 / 5 (Tổng 56 biến thể)
        </span>
        <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary pos-modal-page-btn"
                    th:disabled="${isFirst}"
                    th:data-page="${currentPage - 1}">
                &laquo; Trước
            </button>
            <button type="button" class="btn btn-outline-secondary pos-modal-page-btn"
                    th:disabled="${isLast}"
                    th:data-page="${currentPage + 1}">
                Sau &raquo;
            </button>
        </div>
    </div>
</div>
</body>
</html>
