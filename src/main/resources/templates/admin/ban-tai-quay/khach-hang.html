<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="results" id="pos-customer-results" aria-live="polite">
 <div class="data-table-scroll" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-ban-tai-quay-khach-hang-1" class="admin-table data-table" data-customer-options><thead><tr><th scope="col">STT</th><th scope="col">Họ tên</th><th scope="col">SĐT</th><th scope="col">Hành động</th></tr></thead><tbody><tr th:each="c,rowIndex:${customerPage.content}"><td class="row-number" th:text="${customerPage.number * customerPage.size + rowIndex.count}"></td><td th:text="${c.full_name}"></td><td th:text="${c.phone}"></td><td><button type="button" class="btn btn-sm btn-outline-primary" th:data-customer-id="${c.id}" th:data-customer-label="${c.full_name}+' · '+${c.phone}">Chọn</button></td></tr></tbody></table></div>
 <p th:if="${customerPage.empty}" class="sales-muted">Không tìm thấy khách hàng phù hợp.</p>
 <nav th:replace="~{fragments/phan-trang :: phan-trang(${customerPage},'customerPage')}"></nav>
</div></body></html>
