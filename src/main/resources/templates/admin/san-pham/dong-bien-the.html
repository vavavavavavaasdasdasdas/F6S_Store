<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><table><tbody>
<tr th:fragment="row(v,stt)" th:data-variant-row="${v.id}" th:data-product-id="${v.product_id}">
<td class="row-number" th:text="${stt}"></td><td th:text="${v.code}"></td><td th:text="${v.name}"></td><td th:text="${v.variant_code}"></td>
<td><span data-read th:text="${v.size_value}"></span><div data-edit hidden><label class="visually-hidden" th:for="'row-'+${v.id}+'-sizeId'">Kích cỡ</label><select class="form-select" name="sizeId" th:id="'row-'+${v.id}+'-sizeId'" th:form="'variant-form-'+${v.id}" required data-creatable="true" th:attr="data-create-input='#row-'+${v.id}+'-newSizeValue',data-maxlength='10'"><option value="">Chọn kích cỡ</option><option th:each="choice:${sizes}" th:value="${choice.id}" th:selected="${choice.id==v.size_id}" th:text="${choice.sizeValue}"></option></select><input type="hidden" name="newSizeValue" th:id="'row-'+${v.id}+'-newSizeValue'" th:form="'variant-form-'+${v.id}"><p class="field-error" data-field-error="sizeId" aria-live="polite"></p></div></td>
<td><span data-read th:text="${v.color_name}"></span><div data-edit hidden><label class="visually-hidden" th:for="'row-'+${v.id}+'-colorId'">Màu sắc</label><select class="form-select" name="colorId" th:id="'row-'+${v.id}+'-colorId'" th:form="'variant-form-'+${v.id}" required data-creatable="true" th:attr="data-create-input='#row-'+${v.id}+'-newColorName',data-maxlength='100'"><option value="">Chọn màu sắc</option><option th:each="choice:${colors}" th:if="${choice.status==true or choice.id==v.mau_sac_id}" th:value="${choice.id}" th:selected="${choice.id==v.mau_sac_id}" th:text="${choice.name}"></option></select><input type="hidden" name="newColorName" th:id="'row-'+${v.id}+'-newColorName'" th:form="'variant-form-'+${v.id}"><p class="field-error" data-field-error="colorId" aria-live="polite"></p></div></td>
<td><span th:text="${v.material_name}"></span><input type="hidden" name="materialId" th:value="${v.chat_lieu_id}" th:form="'variant-form-'+${v.id}"></td>
<td><span th:text="${v.sole_name}"></span><input type="hidden" name="soleId" th:value="${v.de_giay_id}" th:form="'variant-form-'+${v.id}"></td>
<td><span data-read th:text="${@money.format(v.price)}"></span><div data-edit hidden><label class="visually-hidden" th:for="'row-price-'+${v.id}">Giá (đồng)</label><input class="form-control" type="number" name="price" min="1" step="1" required th:id="'row-price-'+${v.id}" th:value="${v.price}" th:form="'variant-form-'+${v.id}"><p class="field-error" data-field-error="price" aria-live="polite"></p></div></td>
<td><span data-read th:text="${v.quantity}"></span><div data-edit hidden><label class="visually-hidden" th:for="'row-quantity-'+${v.id}">Tồn kho</label><input class="form-control" type="number" name="quantity" min="0" step="1" required th:id="'row-quantity-'+${v.id}" th:value="${v.quantity}" th:form="'variant-form-'+${v.id}"><p class="field-error" data-field-error="quantity" aria-live="polite"></p></div></td>
<td><span data-read th:text="${v.status==true?'Đang bán':'Ngừng bán'}"></span><div data-edit hidden><label class="visually-hidden" th:for="'row-status-'+${v.id}">Trạng thái</label><select class="form-select" name="status" th:id="'row-status-'+${v.id}" th:form="'variant-form-'+${v.id}"><option value="true" th:selected="${v.status==true}">Đang bán</option><option value="false" th:selected="${v.status!=true}">Ngừng bán</option></select><p class="field-error" data-field-error="status" aria-live="polite"></p></div></td>
<td><div data-read class="catalog-actions d-flex align-items-center gap-1"><button class="btn btn-sm btn-outline-primary" type="button" data-row-edit>Sửa</button><button type="button" class="btn btn-sm btn-outline-primary" data-variant-adjust th:data-id="${v.id}" th:data-code="${v.variant_code}" th:data-name="${v.name}" th:data-size="${v.size_value}" th:data-color="${v.color_name}" th:data-qty="${v.quantity}" title="Điều chỉnh tồn kho" aria-label="Điều chỉnh tồn kho">📦</button><button type="button" class="btn btn-sm btn-outline-info" data-variant-history th:data-id="${v.id}" th:data-code="${v.variant_code}" th:data-name="${v.name}" title="Lịch sử kho" aria-label="Lịch sử kho">📜</button><button class="btn btn-sm btn-outline-warning" type="button" data-row-status th:data-selling="${v.status!=true}" th:text="${v.status==true?'Ngừng bán':'Bán lại'}"></button></div>
<div data-edit hidden><label th:for="'row-reason-'+${v.id}">Lý do chỉnh kho</label><input class="form-control" name="reason" maxlength="500" placeholder="Chỉnh trên trang sản phẩm" th:id="'row-reason-'+${v.id}" th:form="'variant-form-'+${v.id}"><p class="field-error" data-field-error="reason" aria-live="polite"></p><button class="btn btn-sm btn-primary" type="submit" th:form="'variant-form-'+${v.id}">Lưu</button><button class="btn btn-sm btn-outline-secondary" type="button" data-row-cancel>Hủy</button></div>
<form data-inline-variant method="post" th:id="'variant-form-'+${v.id}" th:action="@{/admin/products-crud/{productId}/variants/inline-save(productId=${v.product_id})}" novalidate><input type="hidden" name="id" th:value="${v.id}"><input type="hidden" name="productId" th:value="${v.product_id}"><input type="hidden" name="expectedQuantity" th:value="${v.quantity}"></form><p class="field-error" data-row-error role="alert"></p></td>
</tr></tbody></table></body></html>
