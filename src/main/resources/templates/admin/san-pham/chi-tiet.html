<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow" th:text="${product.code}"></span><h1 th:text="${product.name}"></h1><p class="admin-description" th:text="${product.status == true ? 'Đang bán' : 'Ngừng bán'}"></p></div><div class="catalog-actions"><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud/edit/{id}(id=${product.id})}">Sửa sản phẩm</a><a class="btn btn-primary" th:href="@{/admin/products-crud/{id}/variants(id=${product.id})}">Quản lý biến thể</a></div></div>
<div class="admin-panel catalog-detail"><img class="catalog-preview" th:with="resolvedImage=${@productImageUrl.source(product.imageUrl)}" th:src="${resolvedImage}" th:alt="${product.name}" width="300" height="300"><div><h2>Thông tin sản phẩm</h2><p>Thương hiệu: <strong th:text="${product.category!=null ? product.category.name : 'Chưa phân loại'}"></strong></p><p>Đế giày: <strong th:text="${product.sole!=null ? product.sole.name : 'Chưa chọn'}"></strong></p><p class="catalog-description" th:text="${product.description}"></p><a th:if="${product.status}" class="btn btn-outline-primary" th:href="@{/products/{id}(id=${product.id})}">Xem trên cửa hàng</a><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud}">Quay lại danh sách</a></div></div>
<article class="admin-panel mt-4"><h2>Kích cỡ, giá và tồn kho</h2><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-san-pham-chi-tiet-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Kích cỡ</th><th>Chất liệu</th><th>Giá (₫)</th><th>Tồn kho</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="v, rowIndex :${variants}"><td class="row-number" th:text="${variantPage.number * variantPage.size + rowIndex.count}"></td><td th:text="${v.size_value}"></td><td th:text="${v.material_name}"></td><td th:text="${@money.format(v.price)}"></td><td th:text="${v.quantity}"></td><td th:text="${v.status == true ? 'Đang bán' : 'Ngừng bán'}"></td></tr><tr th:if="${#lists.isEmpty(variants)}"><td colspan="6" class="catalog-empty">Chưa có biến thể. Thêm kích cỡ, giá và số lượng để sản phẩm xuất hiện ở cửa hàng.</td></tr></tbody></table></div></article><nav th:replace="~{fragments/phan-trang :: phan-trang(${variantPage},'page')}"></nav></section></body></html>
