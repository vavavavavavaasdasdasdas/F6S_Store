<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><h1 th:text="${product.name}"></h1></div><div class="catalog-actions"><div th:replace="~{fragments/trang-thai-ban :: button('product',${product.id},${product.status})}"></div><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud/edit/{id}(id=${product.id})}">Sửa sản phẩm</a><a class="btn btn-primary" th:href="@{/admin/products-crud/{id}/variants(id=${product.id})}">Chi tiết biến thể</a></div></div>
<div class="admin-panel catalog-detail"><img class="catalog-preview" th:with="resolvedImage=${@productImageUrl.source(product.imageUrl)}" th:src="${resolvedImage}" th:alt="${product.name}" width="300" height="300"><div><h2>Thông tin sản phẩm</h2><p>Mã sản phẩm: <strong th:text="${product.code}"></strong></p><p>Tên sản phẩm: <strong th:text="${product.name}"></strong></p><p>Trạng thái: <strong th:text="${product.status?'Đang bán':'Ngừng bán'}"></strong></p><p>Số biến thể: <strong th:text="${variantCount}"></strong></p><p>Tổng tồn: <strong th:text="${totalStock}"></strong></p><p>Thương hiệu: <strong th:text="${product.category!=null ? product.category.name : 'Chưa phân loại'}"></strong></p><p class="catalog-description" th:text="${product.description}"></p><a th:if="${product.status}" class="btn btn-outline-primary" th:href="@{/products/{id}(id=${product.id})}">Xem trên cửa hàng</a><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud}">Quay lại danh sách</a></div></div>
<div class="product-gallery d-flex flex-wrap gap-2"><img th:each="image:${productImages}" th:with="resolvedImage=${@productImageUrl.source(image.displayPath)}" th:src="${resolvedImage}" alt="Ảnh sản phẩm" width="120" height="120"></div></section></body></html>
