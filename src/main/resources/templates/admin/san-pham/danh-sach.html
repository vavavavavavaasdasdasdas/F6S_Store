<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">QUẢN LÝ HÀNG HÓA</span><h1>Sản phẩm</h1><p class="admin-description">Quản lý thông tin, giá và tồn kho theo từng kích cỡ.</p></div><a class="btn btn-primary" th:href="@{/admin/products-crud/create}">Thêm sản phẩm</a></div>
<div class="admin-panel">
<form class="catalog-filters" method="get" th:action="@{/admin/products-crud}" novalidate>
<div><label for="keyword">Tìm sản phẩm</label><div class="search-control"><input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Tên hoặc mã sản phẩm" maxlength="255"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div>
<div><label for="categoryId">Thương hiệu</label><select id="categoryId" name="categoryId" class="form-select"><option value="">Tất cả thương hiệu</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId==c.id}"></option></select></div>
<div><label for="soleId">Đế giày</label><select id="soleId" name="soleId" class="form-select"><option value="">Tất cả đế giày</option><option th:each="s:${soles}" th:value="${s.id}" th:text="${s.name}" th:selected="${soleId==s.id}"></option></select></div>
<div><label for="materialId">Chất liệu</label><select id="materialId" name="materialId" class="form-select"><option value="">Tất cả chất liệu</option><option th:each="m:${materials}" th:value="${m.id}" th:text="${m.name}" th:selected="${materialId==m.id}"></option></select></div>
<div><label for="filter-status">Trạng thái</label><select id="filter-status" name="status" class="form-select"><option value="">Tất cả trạng thái</option><option value="true" th:selected="${status==true}">Đang bán</option><option value="false" th:selected="${status==false}">Ngừng bán</option></select></div>
<div><label for="sort">Sắp xếp</label><select id="sort" name="sort" class="form-select"><option value="newest" th:selected="${sort=='newest'}">Mới nhất</option><option value="name" th:selected="${sort=='name'}">Tên A–Z</option><option value="code" th:selected="${sort=='code'}">Mã A–Z</option><option value="price_asc" th:selected="${sort=='price_asc'}">Giá tăng dần</option><option value="price_desc" th:selected="${sort=='price_desc'}">Giá giảm dần</option><option value="stock" th:selected="${sort=='stock'}">Tồn kho tăng dần</option></select></div>

<button class="btn btn-outline-primary" type="submit">Lọc</button></form>
<div class="table-wrap"><table class="admin-table catalog-table"><thead><tr><th>Ảnh</th><th>Mã / Tên sản phẩm</th><th>Thương hiệu</th><th>Đế giày</th><th>Chất liệu</th><th>Giá (₫)</th><th>Tồn kho</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
<tr th:each="p:${productPage.content}">
<td><img class="catalog-thumb" th:with="resolvedImage=${@productImageUrl.source(p.image_url)}" th:src="${resolvedImage}" th:alt="${p.name}" width="56" height="56"></td>
<td><span class="catalog-code" th:text="${p.code}"></span><a class="catalog-name" th:href="@{/admin/products-crud/view/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
<td th:text="${p.category_name}"></td><td th:text="${p.sole_name ?: 'Chưa chọn'}"></td><td th:text="${#strings.isEmpty(p.material_names) ? 'Chưa có biến thể đang bán' : p.material_names}"></td><td><span th:if="${p.price!=null}" th:text="${@money.format(p.price)}"></span><span th:if="${p.price!=null and p.price!=p.max_price}" th:text="' – '+${@money.format(p.max_price)}"></span><span class="text-muted" th:if="${p.price==null}">Chưa có biến thể</span></td>
<td th:text="${p.stock}"></td><td><span class="status-pill" th:text="${p.status == true ? 'Đang bán' : 'Ngừng bán'}"></span></td>
<td><div class="catalog-actions"><a th:href="@{/admin/products-crud/view/{id}(id=${p.id})}">Xem</a><a th:href="@{/admin/products-crud/edit/{id}(id=${p.id})}">Sửa</a><a th:href="@{/admin/products-crud/{id}/variants(id=${p.id})}">Quản lý biến thể</a><form th:action="@{/admin/products-crud/delete/{id}(id=${p.id})}" method="post" novalidate data-delete-form><button class="btn-link-danger" type="button" data-delete th:attr="data-object=${p.name}" data-consequence="Sản phẩm có đơn hàng hoặc biến thể sẽ chuyển sang ngừng bán; sản phẩm chưa được tham chiếu sẽ bị xóa.">Xóa</button></form></div></td></tr>
<tr th:if="${productPage.empty}"><td colspan="9" class="catalog-empty">Không tìm thấy sản phẩm. Thử bỏ bớt bộ lọc hoặc thêm sản phẩm mới.</td></tr>
</tbody></table></div>

</div><nav th:replace="~{fragments/phan-trang :: phan-trang(${productPage},'page')}"></nav></section></body></html>
