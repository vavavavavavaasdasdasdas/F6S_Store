<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><h1>Chi tiết sản phẩm</h1></div><a class="btn btn-primary" th:href="@{/admin/products-crud/create}" data-add-icon>Thêm sản phẩm</a></div>
<div class="admin-panel"><p th:if="${createdProductId!=null}"><a class="btn btn-primary" th:href="@{/admin/products-crud/{id}/variants(id=${createdProductId})}">Chi tiết biến thể</a></p>
<form class="catalog-filters mb-3" method="get" th:action="@{/admin/products-crud}" novalidate>
<div><label for="keyword">Từ khóa</label><div class="search-control"><input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Mã hoặc tên sản phẩm" maxlength="255"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div>
<div><label for="categoryId">Thương hiệu</label><select id="categoryId" name="categoryId" class="form-select"><option value="">Tất cả thương hiệu</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId==c.id}"></option></select></div>


<div><label for="filter-status">Trạng thái</label><select id="filter-status" name="status" class="form-select"><option value="">Tất cả trạng thái</option><option value="true" th:selected="${status==true}">Đang bán</option><option value="false" th:selected="${status==false}">Ngừng bán</option></select></div>


<div><label for="sort">Sắp xếp</label><select id="sort" name="sort" class="form-select"><option value="newest" th:selected="${sort=='newest'}">Mới nhất</option><option value="name" th:selected="${sort=='name'}">Tên A–Z</option><option value="code" th:selected="${sort=='code'}">Mã A–Z</option></select></div>
<div class="filter-actions"><button class="btn btn-outline-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud}">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</form>
<div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-san-pham-danh-sach-1" class="admin-table catalog-table data-table"><thead><tr><th class="row-number">STT</th><th>Ảnh</th><th>Mã</th><th>Tên sản phẩm</th><th>Thương hiệu</th><th>Số biến thể</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
<tr th:each="p,rowIndex:${productPage.content}"><td class="row-number" th:text="${productPage.number*productPage.size+rowIndex.count}"></td><td><img class="catalog-thumb" th:with="resolvedImage=${@productImageUrl.source(p.image_url)}" th:src="${resolvedImage}" th:alt="${p.name}" width="56" height="56"></td><td th:text="${p.code}"></td><td th:text="${p.name}"></td><td th:text="${p.category_name}"></td><td th:text="${p.variant_count}"></td><td th:text="${p.status?'Đang bán':'Ngừng bán'}"></td><td><div class="catalog-actions"><a th:href="@{/admin/products-crud/{id}/variants(id=${p.id})}">Chi tiết biến thể</a><a th:href="@{/admin/products-crud/view/{id}(id=${p.id})}">Xem</a><a th:href="@{/admin/products-crud/edit/{id}(id=${p.id})}">Sửa</a><div th:replace="~{fragments/trang-thai-ban :: button('product',${p.id},${p.status})}"></div><form th:action="@{/admin/products-crud/delete/{id}(id=${p.id})}" method="post" novalidate data-delete-form><button type="button" class="btn-link-danger" data-delete th:attr="data-object=${p.name}" data-consequence="Sản phẩm có dữ liệu liên quan sẽ chuyển sang ngừng bán.">Xóa</button></form></div></td></tr><tr th:if="${productPage.empty}"><td colspan="8">Không tìm thấy sản phẩm.</td></tr>
</tbody></table></div>

</div><nav th:replace="~{fragments/phan-trang :: phan-trang(${productPage},'page')}"></nav></section></body></html>
