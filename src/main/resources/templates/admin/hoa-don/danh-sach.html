<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>
<div class="admin-heading"><div><span class="eyebrow">BÁN HÀNG</span><h1>Hóa đơn</h1><p class="admin-description">Hóa đơn của các đơn trực tuyến và bán tại quầy.</p></div><a class="btn btn-primary" href="/admin/pos">Bán hàng tại quầy</a></div><div class="admin-panel"><form class="catalog-filters mb-3" action="/admin/invoices" method="get" novalidate>
<div><label for="q">Mã hóa đơn</label><input class="form-control" id="q" name="q" th:value="${q}" type="search" placeholder="Nhập mã hóa đơn"></div>
<div><label for="invoice-channel">Kênh bán</label><select class="form-select" id="invoice-channel" name="channel"><option value="">Tất cả kênh</option><option value="ONLINE" th:selected="${channel=='ONLINE'}">Trực tuyến (Online)</option><option value="POS" th:selected="${channel=='POS'}">Tại quầy (POS)</option></select></div>
<div><label for="from">Từ ngày</label><input class="form-control" id="from" type="date" name="from" th:value="${from}"></div>
<div><label for="to">Đến ngày</label><input class="form-control" id="to" type="date" name="to" th:value="${to}"></div>
<div class="filter-actions"><button class="btn btn-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" href="/admin/invoices">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</form><div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-hoa-don-danh-sach-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Hóa đơn</th><th>Đơn hàng</th><th>Ngày</th><th>Khách</th><th>Nhân viên</th><th class="money">Tổng (đ)</th><th>Thanh toán</th></tr></thead><tbody><tr th:each="i, rowIndex :${invoices.content}"><td class="row-number" th:text="${invoices.number * invoices.size + rowIndex.count}"></td><td><a th:href="@{/admin/invoices/{id}(id=${i.id})}" th:text="${i.invoiceCode}"></a></td><td><a th:href="@{/admin/orders/{id}(id=${i.order.id})}" th:text="${i.order.orderCode}"></a></td><td th:text="${#temporals.format(i.issuedAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${i.customerName}"></td><td th:text="${i.employeeName}"></td><td class="money" th:text="${@money.format(i.order.finalAmount)}"></td><td th:text="${i.order.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></td></tr><tr th:if="${invoices.empty}"><td colspan="8" class="sales-empty">Không có hóa đơn phù hợp.</td></tr></tbody></table></div></div>
<nav th:replace="~{fragments/phan-trang :: phan-trang(${invoices},'page')}"></nav></section></body></html>
