<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>
<div class="admin-heading invoice-actions"><h1>Chi tiết hóa đơn</h1><div><button type="button" class="btn btn-primary" data-print-invoice>In hóa đơn</button> <a class="btn btn-outline-secondary" href="/admin/invoices">Danh sách</a></div></div><article class="invoice-paper" th:with="o=${invoice.order}"><header class="invoice-header"><div><h2 th:text="${shopName}"></h2><p th:if="${!#strings.isEmpty(shopAddress)}" th:text="${shopAddress}"></p><p th:if="${!#strings.isEmpty(shopPhone)}" th:text="'SĐT: '+${shopPhone}"></p></div><div><h2>HÓA ĐƠN BÁN HÀNG</h2><strong th:text="${invoice.invoiceCode}"></strong><p th:text="${#temporals.format(invoice.issuedAt,'dd/MM/yyyy HH:mm')}"></p></div></header><div class="invoice-meta"><p>Đơn hàng: <a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${o.orderCode}"></a><br>Kênh bán: <strong th:text="${o.orderType=='POS'?'Tại quầy':'Trực tuyến'}"></strong></p><p>Khách: <strong th:text="${invoice.customerName}"></strong><br><span th:if="${invoice.customerPhone!=null}" th:text="'SĐT: '+${invoice.customerPhone}"></span><br>Nhân viên: <span th:text="${invoice.employeeName=='Đơn online'?'Đơn trực tuyến':invoice.employeeName}"></span></p></div><div class="data-table-scroll" role="region" aria-label="Chi tiết hóa đơn, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-hoa-don-chi-tiet-1" class="invoice-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Ảnh</th><th>Mã</th><th>Tên sản phẩm</th><th>Kích cỡ</th><th>Chất liệu</th><th>SL</th><th class="money">Đơn giá (đ)</th><th class="money">Thành tiền (đ)</th></tr></thead><tbody><tr th:each="d, rowIndex :${o.orderDetails}"><td class="row-number" th:text="${rowIndex.count}"></td><td><img class="product-thumbnail" th:with="resolvedImage=${@productImageUrl.source(d.productVariant.product.displayImageUrl)}" th:src="${resolvedImage}" th:alt="${d.productName}+' — ảnh chính'" width="56" height="56"></td><td th:text="${d.productVariant.product.code}"></td><td><span th:text="${d.productName!=null?d.productName:d.productVariant.product.name}"></span></td><td th:text="${d.sizeName!=null?d.sizeName:d.productVariant.size.sizeValue}"></td><td th:text="${d.displayMaterialName}"></td><td th:text="${d.quantity}"></td><td class="money" th:text="${@money.format(d.price)}"></td><td class="money" th:text="${@money.format(d.totalPrice)}"></td></tr></tbody></table></div><dl class="invoice-totals"><dt>Tạm tính</dt><dd th:text="${@money.format(o.totalAmount)}+' đ'"></dd><dt>Giảm giá</dt><dd th:text="${@money.format(o.discountAmount)}+' đ'"></dd><dt>Phí giao hàng</dt><dd th:text="${@money.format(o.shippingFee)}+' đ'"></dd><dt>TỔNG THANH TOÁN</dt><dd><strong th:text="${@money.format(o.finalAmount)}+' đ'"></strong></dd><dt>Phương thức</dt><dd th:text="${o.paymentMethod=='TRANSFER' || o.paymentMethod=='BANK_TRANSFER'?'Chuyển khoản':o.paymentMethod=='COD'?'Thanh toán khi nhận hàng':'Tiền mặt'}"></dd><dt>Thanh toán</dt><dd th:text="${o.status=='CANCELLED'?'Đơn đã hủy':o.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></dd><dt th:if="${invoice.cashReceived!=null}">Khách đưa</dt><dd th:if="${invoice.cashReceived!=null}" th:text="${@money.format(invoice.cashReceived)}+' đ'"></dd><dt th:if="${invoice.changeAmount!=null}">Tiền thừa</dt><dd th:if="${invoice.changeAmount!=null}" th:text="${@money.format(invoice.changeAmount)}+' đ'"></dd></dl><footer class="invoice-thanks">Cảm ơn quý khách!</footer></article><script src="/js/in-hoa-don.js" defer></script>
</section></body></html>
