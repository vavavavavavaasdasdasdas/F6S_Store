<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}">
<body>
<section class="catalog-page">
    <div class="admin-heading">
        <div>
            <h1 th:text="${lookupTitle}"></h1>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/{kind}/create(kind=${kind})}" th:text="'Thêm ' + ${lookupTitle.toLowerCase()}" data-add-icon></a>
    </div>

    <div class="admin-panel">
        <p role="status" aria-live="polite" data-switch-banner hidden></p>
        <form class="catalog-filters mb-3" method="get" th:action="@{/admin/{kind}(kind=${kind})}" novalidate>
            <div>
                <label for="keyword" th:text="'Từ khóa ' + ${lookupTitle.toLowerCase()}"></label>
                <div class="search-control">
                    <input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}"
                           th:placeholder="'Nhập ' + ${lookupTitle.toLowerCase()} + ' cần tìm...'" maxlength="100">
                    <button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button>
                </div>
            </div>
            <div>
                <label for="lookup-status">Trạng thái</label>
                <select id="lookup-status" name="status" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="true" th:selected="${status == true}">Đang hiển thị</option>
                    <option value="false" th:selected="${status == false}">Đang ẩn</option>
                </select>
            </div>
            <div>
                <label for="lookup-inUse">Tình trạng sử dụng</label>
                <select id="lookup-inUse" name="inUse" class="form-select">
                    <option value="">Tất cả tình trạng</option>
                    <option value="true" th:selected="${inUse == true}">Đang dùng</option>
                    <option value="false" th:selected="${inUse == false}">Chưa dùng</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn btn-outline-primary" type="submit">Lọc</button>
                <a th:href="@{/admin/{kind}(kind=${kind})}" class="btn btn-outline-secondary">Xóa lọc</a>
                <span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span>
            </div>
        </form>

        <div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0">
            <table data-table-key="admin-danh-muc-kich-co-danh-sach-1" class="admin-table data-table">
                <thead>
                    <tr><th scope="col" class="row-number">STT</th><th>Mã</th>
                        <th th:text="${kind == 'sizes' ? 'Kích cỡ' : (kind == 'materials' ? 'Tên chất liệu' : (kind == 'soles' ? 'Tên đế giày' : 'Tên thương hiệu'))}"></th>
                        <th style="width: 160px;">Trạng thái</th>
                        <th th:if="${kind == 'materials' or kind == 'soles'}">Đang dùng</th>
                        <th style="width: 180px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, rowIndex : ${items}" th:attr="data-lookup-row=${item.id}" th:classappend="${item.status == false} ? 'row-muted' : ''"><td class="row-number" th:text="${items.number * items.size + rowIndex.count}"></td><td th:text="${item.code}"></td>
                        <td>
                            <strong th:text="${kind == 'sizes' ? item.sizeValue : item.name}"></strong>
                        </td>
                        <td data-status-cell>
                            <span data-status-badge th:class="${item.status == true ? 'badge bg-success-subtle text-success border border-success-subtle px-2 py-1' : 'badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1'}"
                                  th:text="${item.status == true ? 'Đang hiển thị' : 'Đã tắt'}"></span>
                        </td>
                        <td th:if="${kind == 'soles'}"><a th:href="@{/admin/variants(soleId=${item.id})}" th:text="${soleUsage[item.id] ?: 0} + ' biến thể'"></a></td>
                        <td th:if="${kind == 'materials'}"><a th:href="@{/admin/variants(materialId=${item.id})}" th:text="${materialUsage[item.id] ?: 0} + ' biến thể'"></a></td>
                        <td>
                            <div class="catalog-actions" style="display:flex; align-items:center; gap:8px;">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/{kind}/edit/{id}(kind=${kind}, id=${item.id})}">Sửa</a>
                                <th:block th:if="${kind == 'categories'}">
                                    <div th:replace="~{fragments/trang-thai-ban :: categorySwitch(${item.id},${item.status},${item.name})}"></div>
                                </th:block>
                                <th:block th:unless="${kind == 'categories'}">
                                    <div th:replace="~{fragments/trang-thai-ban :: lookupSwitch(${kind},${item.id},${item.status},${kind == 'sizes' ? item.sizeValue : item.name},${kind == 'sizes' ? 'kích cỡ' : (kind == 'materials' ? 'chất liệu' : 'đế giày')})}"></div>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${items.empty}">
                        <td th:colspan="${kind == 'sizes' ? 4 : (kind == 'materials' or kind == 'soles' ? 6 : 5)}" class="catalog-empty text-center py-4">
                            Không tìm thấy dữ liệu phù hợp. Chọn nút <strong>Thêm</strong> để tạo bản ghi mới.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav th:replace="~{fragments/phan-trang :: phan-trang(${items}, 'page')}"></nav>
</section>
</body>
</html>
