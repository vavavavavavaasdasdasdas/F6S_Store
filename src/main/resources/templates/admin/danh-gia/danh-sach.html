<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>
<div class="admin-heading"><h1>Đánh giá</h1></div><div class="admin-panel"><form action="/admin/reviews" method="get" class="filter-bar mb-3" novalidate>
<div><label for="q">Mã hoặc tên sản phẩm</label><input class="form-control" id="q" name="q" th:value="${q}"></div><div><label for="productId">Sản phẩm</label><select id="productId" name="productId" class="form-select"><option value="">Tất cả sản phẩm</option><option th:each="p:${reviewProducts}" th:value="${p.id}" th:text="${p.code}+' — '+${p.name}" th:selected="${productId==p.id}"></option></select></div>
<div><label for="stars">Số sao</label><select id="stars" name="stars" class="form-select"><option value="">Tất cả</option><option th:each="n:${#numbers.sequence(5,1)}" th:value="${n}" th:text="${n}+' sao'" th:selected="${stars==n.toString()}"></option></select></div>
<div><label for="visible">Hiển thị</label><select id="visible" name="visible" class="form-select"><option value="">Tất cả</option><option value="true" th:selected="${visible==true}">Đang hiển thị</option><option value="false" th:selected="${visible==false}">Đã ẩn</option></select></div>
<div><label for="from">Từ ngày</label><input id="from" name="from" type="date" class="form-control" th:value="${from}"></div><div><label for="to">Đến ngày</label><input id="to" name="to" type="date" class="form-control" th:value="${to}"></div><div class="d-flex gap-2 align-items-end"><button class="btn btn-primary" type="submit">Lọc</button><a href="/admin/reviews" class="btn btn-outline-secondary">Xóa lọc</a></div></form>
<div class="data-table-scroll" role="region" aria-label="Đánh giá, cuộn ngang để xem đủ cột" tabindex="0"><table class="admin-table data-table" data-table-key="admin-danh-gia"><thead><tr><th>STT</th><th>Mã</th><th>Sản phẩm</th><th>Khách</th><th>Số sao</th><th>Nội dung</th><th>Ngày</th><th>Hiển thị</th><th>Hành động</th></tr></thead><tbody><tr th:each="r,it:${reviewPage.content}"><td th:text="${reviewPage.number*reviewPage.size+it.count}"></td><td th:text="${r.code}"></td><td th:text="${r.product.name}"></td><td th:text="${r.customer.fullName}"></td><td th:text="${r.stars}"></td><td class="review-content-cell" th:text="${r.content}"></td><td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><th:block th:replace="~{fragments/cong-tac-khuyen-mai :: switch-field('reviews',${r.id},${r.visible},${r.visible?'Đang hiển thị':'Đã ẩn'},'Hiển thị')}"></th:block></td><td class="table-actions"><a class="btn btn-outline-secondary" th:href="@{/admin/reviews/{id}(id=${r.id})}">Xem</a></td></tr><tr th:if="${reviewPage.empty}"><td colspan="9">Không có đánh giá phù hợp.</td></tr></tbody></table></div><nav th:replace="~{fragments/phan-trang :: phan-trang(${reviewPage},'page')}"></nav></div><script src="/js/quan-tri-giam-gia.js" defer></script>
</section></body></html>
