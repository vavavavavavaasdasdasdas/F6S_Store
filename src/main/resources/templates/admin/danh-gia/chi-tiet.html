<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section><div class="admin-heading"><h1>Chi tiết đánh giá</h1><a class="btn btn-outline-secondary" href="/admin/reviews">Danh sách đánh giá</a></div><article class="admin-panel"><dl><dt>Mã</dt><dd th:text="${review.code}"></dd><dt>Sản phẩm</dt><dd th:text="${review.product.name}"></dd><dt>Khách</dt><dd th:text="${review.customer.fullName}"></dd><dt>Đơn đã nhận</dt><dd><a th:href="@{/admin/invoices/order/{id}(id=${review.order.id})}" th:text="${review.order.orderCode}"></a></dd><dt>Số sao</dt><dd th:text="${review.stars}"></dd><dt>Ngày</dt><dd th:text="${#temporals.format(review.createdAt,'dd/MM/yyyy HH:mm')}"></dd><dt>Nội dung</dt><dd class="review-body" th:text="${review.content}"></dd></dl><th:block th:replace="~{fragments/cong-tac-khuyen-mai :: switch-field('reviews',${review.id},${review.visible},${review.visible?'Đang hiển thị':'Đã ẩn'},'Hiển thị')}"></th:block></article><script src="/js/quan-tri-giam-gia.js" defer></script></section></body></html>
