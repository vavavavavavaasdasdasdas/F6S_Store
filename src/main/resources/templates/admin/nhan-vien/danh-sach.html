<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">QUẢN LÝ HỒ SƠ</span><h1>Nhân viên</h1><p class="admin-description">Quản lý hồ sơ và tài khoản nhân viên trong cùng một giao dịch.</p></div><a class="btn btn-primary" href="/admin/employees/create">Thêm nhân viên</a></div>
<div class="admin-panel">
<form class="catalog-filters" method="get" novalidate action="/admin/employees"><div><label for="keyword">Tìm nhân viên</label><div class="search-control"><input id="keyword" class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Tên, số điện thoại hoặc thư điện tử" maxlength="100"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div><button class="btn btn-outline-primary" type="submit">Tìm kiếm</button></form>
<div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-nhan-vien-danh-sach-1" class="admin-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã</th><th>Họ tên</th><th>SĐT</th><th>Email</th><th>Địa chỉ</th><th>Tài khoản</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
<tr th:each="p, rowIndex :${peoplePage.content}"><td class="row-number" th:text="${peoplePage.number * peoplePage.size + rowIndex.count}"></td><td><span class="catalog-code" th:text="${p.employeeCode}"></span></td><td><a class="catalog-name" th:href="@{/admin/employees/detail/{id}(id=${p.id})}" th:text="${p.fullName}"></a></td><td><span class="people-contact" th:text="${p.phone}"></span></td><td><span class="people-contact" th:text="${p.email}"></span></td><td th:text="${p.address ?: 'Chưa có'}"></td><td th:text="${p.user!=null ? p.user.username : 'Chưa có tài khoản'}"></td><td><span class="status-pill" th:text="${p.status==true ? 'Hoạt động' : 'Vô hiệu hóa'}"></span></td><td><div class="catalog-actions"><a th:href="@{/admin/employees/detail/{id}(id=${p.id})}">Xem chi tiết</a><a th:href="@{/admin/employees/edit/{id}(id=${p.id})}">Sửa</a></div></td></tr>
<tr th:if="${peoplePage.empty}"><td colspan="9" class="catalog-empty">Không tìm thấy hồ sơ. Thử từ khóa khác hoặc thêm hồ sơ mới.</td></tr></tbody></table></div>
</div>
<nav th:replace="~{fragments/phan-trang :: phan-trang(${peoplePage},'page')}"></nav></section></body></html>
