<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow" th:text="${person.employeeCode}"></span><h1 th:text="${person.fullName}"></h1><p class="admin-description">Chi tiết nhân viên</p></div><a class="btn btn-primary" th:href="@{/admin/employees/edit/{id}(id=${person.id})}">Sửa thông tin</a></div>
<div class="admin-panel"><dl class="people-details"><div><dt>Số CCCD</dt><dd th:text="${person.soCccd ?: 'Chưa có'}"></dd></div><div><dt>Ngày sinh</dt><dd th:text="${person.ngaySinh ?: 'Chưa có'}"></dd></div><div><dt>Giới tính</dt><dd th:text="${person.gioiTinh ?: 'Chưa có'}"></dd></div><div><dt>Số điện thoại</dt><dd th:text="${person.phone ?: 'Chưa có'}"></dd></div><div><dt>Thư điện tử</dt><dd th:text="${person.email ?: 'Chưa có'}"></dd></div><div><dt>Địa chỉ</dt><dd th:text="${person.address ?: 'Chưa có'}"></dd></div><div><dt>Trạng thái hồ sơ</dt><dd th:text="${person.status==true ? 'Hoạt động' : 'Vô hiệu hóa'}"></dd></div><div><dt>Tài khoản</dt><dd th:text="${person.user!=null ? person.user.username : 'Chưa có tài khoản'}"></dd></div><div th:if="${person.user!=null}"><dt>Trạng thái tài khoản</dt><dd th:text="${person.user.status==true ? 'Hoạt động' : 'Vô hiệu hóa'}"></dd></div>
<div><dt>Chức vụ</dt><dd th:text="${person.position ?: 'Chưa có'}"></dd></div><div><dt>Quyền</dt><dd th:text="${person.user.role.name=='ROLE_ADMIN'?'Quản trị viên':person.user.role.name=='ROLE_USER'?'Khách hàng':'Quyền khác'}"></dd></div>
</dl><p th:if="${self}" class="field-help">Đây là tài khoản đang đăng nhập. Không thể tự vô hiệu hóa hoặc xóa.</p>
<div class="catalog-form-actions"><form method="post" novalidate th:action="@{/admin/employees/status/{id}(id=${person.id})}"><input type="hidden" name="enabled" th:value="${person.status!=true}"><button type="button" class="btn btn-outline-secondary" data-confirm th:disabled="${self and person.status==true}" th:attr="data-confirm-title=${person.status==true ? 'Vô hiệu hóa hồ sơ?' : 'Kích hoạt hồ sơ?'},data-confirm-message=${person.fullName}+' — '+${person.status==true ? 'Tài khoản liên kết sẽ bị khóa. Đơn hàng cũ được giữ nguyên.' : 'Hồ sơ được kích hoạt; tài khoản chỉ mở khi các hồ sơ liên kết đều hoạt động.'}" th:text="${person.status==true ? 'Vô hiệu hóa' : 'Kích hoạt'}"></button></form>
<form method="post" novalidate th:action="@{/admin/employees/delete/{id}(id=${person.id})}"><button type="button" class="btn btn-outline-danger" data-delete th:disabled="${self}" th:attr="data-object=${person.fullName}" data-consequence="Hồ sơ có đơn hàng hoặc dữ liệu liên quan chỉ bị vô hiệu hóa. Hồ sơ chưa được tham chiếu và tài khoản đi kèm sẽ bị xóa.">Xóa hồ sơ</button></form><a class="btn btn-outline-secondary" href="/admin/employees">Quay lại danh sách</a></div></div>
<div th:replace="~{fragments/can-cuoc :: resend('employees')}"></div></section></body></html>
