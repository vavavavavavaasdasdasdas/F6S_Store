<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">BIẾN THỂ SẢN PHẨM</span><h1 th:text="${variant.id==null ? 'Thêm biến thể' : 'Sửa biến thể'}"></h1><p class="admin-description">Giá phải lớn hơn 0. Mọi thay đổi số lượng đều có lịch sử.</p></div></div>
<form class="admin-panel catalog-form catalog-form-narrow" method="post" th:action="@{/admin/variants/save}" th:object="${variant}" novalidate data-admin-form><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{expectedQuantity}"><p class="form-message" role="alert" hidden></p>
<div class="catalog-field"><label for="productId">Sản phẩm *</label><select class="form-select" id="productId" th:field="*{productId}" required aria-describedby="productId-error"><option value="">Chọn sản phẩm</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.code}+' · '+${p.name}"></option></select><p class="field-error" id="productId-error" aria-live="polite"><span th:if="${#fields.hasErrors('productId')}" th:errors="*{productId}"></span></p></div>
<div class="catalog-field"><label for="sizeId">Kích cỡ *</label><input type="hidden" id="newSizeValue" th:field="*{newSizeValue}"><select class="form-select" id="sizeId" th:field="*{sizeId}" required data-creatable="true" data-create-input="#newSizeValue" data-maxlength="10" aria-describedby="sizeId-error"><option value="">Chọn kích cỡ</option><option th:each="s:${sizes}" th:value="${s.id}" th:text="${s.sizeValue}"></option></select><p class="field-error" id="sizeId-error" aria-live="polite"><span th:if="${#fields.hasErrors('sizeId')}" th:errors="*{sizeId}"></span></p></div>
<div class="catalog-field"><label for="materialId">Chất liệu *</label><input type="hidden" id="newMaterialName" th:field="*{newMaterialName}"><select class="form-select" id="materialId" th:field="*{materialId}" required data-creatable="true" data-create-input="#newMaterialName" data-maxlength="100" aria-describedby="materialId-error"><option value="">Chọn chất liệu</option><option th:each="m:${materials}" th:value="${m.id}" th:text="${m.name}"></option></select><p class="field-error" id="materialId-error" aria-live="polite"><span th:if="${#fields.hasErrors('materialId')}" th:errors="*{materialId}"></span></p></div>
<div class="catalog-field"><label for="price">Giá bán (₫) *</label><input class="form-control" id="price" type="number" th:field="*{price}" required min="0.01" max="9999999999999999.99" step="0.01" aria-describedby="price-error" th:attr="aria-invalid=${#fields.hasErrors('price')}"><p class="field-error" id="price-error" aria-live="polite"><span th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span></p></div>
<div class="catalog-field"><label for="quantity">Số lượng *</label><input class="form-control" id="quantity" type="number" th:field="*{quantity}" required min="0" max="2147483647" step="1" aria-describedby="quantity-error" th:attr="aria-invalid=${#fields.hasErrors('quantity')}"><p class="field-error" id="quantity-error" aria-live="polite"><span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span></p></div>
<div class="catalog-field"><label for="status">Trạng thái</label><select id="status" class="form-select" th:field="*{status}" required aria-describedby="status-error"><option value="true">Đang hoạt động</option><option value="false">Ngừng hoạt động</option></select><p class="field-error" id="status-error" aria-live="polite"><span th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span></p></div>
<div class="catalog-field"><label for="reason">Lý do thay đổi tồn kho</label><input class="form-control" id="reason" type="text" th:field="*{reason}" maxlength="500" data-stock-reason aria-describedby="reason-error" th:attr="aria-invalid=${#fields.hasErrors('reason')}"><p class="field-error" id="reason-error" aria-live="polite"><span th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></span></p></div>
<p class="field-help">Bắt buộc nhập lý do nếu thay đổi số lượng biến thể đã có. Không đổi tồn kho: để trống.</p>
<div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu biến thể</button><a class="btn btn-outline-secondary" th:href="@{/admin/variants(productId=${variant.productId})}">Quay lại biến thể</a></div></form></section></body></html>
