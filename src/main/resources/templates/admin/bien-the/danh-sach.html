<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">SIZE · GIÁ · TỒN KHO</span><h1 th:text="${selectedProduct!=null ? 'Biến thể: '+selectedProduct.name : 'Biến thể sản phẩm'}"></h1><p class="admin-description">Mỗi bộ ba sản phẩm, kích cỡ và chất liệu là một biến thể duy nhất.</p></div><a class="btn btn-primary" th:href="@{/admin/variants/create(productId=${productId})}">Thêm biến thể</a></div>
<div class="admin-panel"><form class="catalog-filters mb-3" method="get" th:action="@{/admin/variants}" novalidate>
<div><label for="keyword">Từ khóa</label><div class="search-control"><input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Mã, tên sản phẩm, size..." maxlength="100"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div>
<div><label for="productId">Sản phẩm</label><select class="form-select" id="productId" name="productId"><option value="">Tất cả sản phẩm</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.code}+' · '+${p.name}" th:selected="${productId==p.id}"></option></select></div>
<div><label for="sizeId">Kích cỡ</label><select class="form-select" id="sizeId" name="sizeId"><option value="">Tất cả kích cỡ</option><option th:each="s:${sizes}" th:value="${s.id}" th:selected="${sizeId==s.id}" th:text="${s.sizeValue}"></option></select></div>
<div><label for="materialId">Chất liệu</label><select class="form-select" id="materialId" name="materialId"><option value="">Tất cả chất liệu</option><option th:each="m:${materials}" th:value="${m.id}" th:selected="${materialId==m.id}" th:text="${m.name}"></option></select></div>
<div><label for="variant-status">Trạng thái</label><select class="form-select" id="variant-status" name="status"><option value="">Tất cả trạng thái</option><option value="true" th:selected="${status==true}">Đang bán</option><option value="false" th:selected="${status==false}">Ngừng bán</option></select></div>
<div class="filter-actions"><button class="btn btn-outline-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" th:href="@{/admin/variants}">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</form>
<div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-bien-the-danh-sach-1" class="admin-table catalog-table data-table"><thead><tr><th scope="col" class="row-number">STT</th><th>Mã</th><th>Tên sản phẩm</th><th>Kích cỡ</th><th>Chất liệu</th><th>Giá (₫)</th><th>Tồn kho</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody><tr th:each="v, rowIndex :${variants}"><td class="row-number" th:text="${dataPage.number * dataPage.size + rowIndex.count}"></td><td><span class="catalog-code" th:text="${v.code}"></span></td><td><span class="catalog-name" th:text="${v.name}"></span></td><td th:text="${v.size_value}"></td><td th:text="${v.material_name}"></td><td th:text="${@money.format(v.price)}"></td><td th:text="${v.quantity}"></td><td th:text="${v.status == true ? 'Đang bán' : 'Ngừng bán'}"></td><td><div class="catalog-actions"><a th:href="@{/admin/variants/edit/{id}(id=${v.id})}">Sửa biến thể</a><a th:href="@{/admin/inventory/adjust/{id}(id=${v.id})}">Điều chỉnh tồn</a></div></td></tr><tr th:if="${#lists.isEmpty(variants)}"><td colspan="9" class="catalog-empty">Chưa có biến thể. Chọn “Thêm biến thể” để tạo kích cỡ, giá và tồn kho.</td></tr></tbody></table></div>
<a class="btn btn-outline-secondary mt-3" th:href="@{/admin/products-crud}">Quay lại sản phẩm</a></div><nav th:replace="~{fragments/phan-trang :: phan-trang(${dataPage},'page')}"></nav></section></body></html>
