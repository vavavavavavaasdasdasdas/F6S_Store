<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section>
<div class="admin-heading"><div><h1>Thời gian giao hàng</h1><p>Ngày lịch tính từ ngày đặt; xác nhận muộn tính từ ngày xác nhận. Đơn đã xác nhận giữ dự kiến đã lưu.</p></div></div>
<section class="admin-panel mb-4"><h2>Kho và phí vận chuyển</h2><p>Đường chim bay; miễn phí theo tổng số lượng. Thay đổi chỉ áp dụng khi tạo đơn mới.</p><form method="post" th:action="@{/admin/shipping-times/settings}" th:object="${shippingSettings}" data-admin-form novalidate class="shipping-settings-form"><p class="form-message" role="alert" hidden></p><div class="catalog-field"><label for="ship-setting-originAddress">Địa chỉ kho *</label><input id="ship-setting-originAddress" class="form-control" th:field="*{originAddress}" type="text" required aria-describedby="ship-setting-originAddress-error"><p class="field-error" id="ship-setting-originAddress-error" th:errors="*{originAddress}"></p></div><div class="catalog-field"><label for="ship-setting-originLatitude">Vĩ độ kho *</label><input id="ship-setting-originLatitude" class="form-control" th:field="*{originLatitude}" type="number" required min="-90" max="90" step="0.0000001" aria-describedby="ship-setting-originLatitude-error"><p class="field-error" id="ship-setting-originLatitude-error" th:errors="*{originLatitude}"></p></div><div class="catalog-field"><label for="ship-setting-originLongitude">Kinh độ kho *</label><input id="ship-setting-originLongitude" class="form-control" th:field="*{originLongitude}" type="number" required min="-180" max="180" step="0.0000001" aria-describedby="ship-setting-originLongitude-error"><p class="field-error" id="ship-setting-originLongitude-error" th:errors="*{originLongitude}"></p></div><div class="catalog-field"><label for="ship-setting-firstLimitKm">Mốc khoảng cách đầu (km) *</label><input id="ship-setting-firstLimitKm" class="form-control" th:field="*{firstLimitKm}" type="number" required min="0" step="0.01" aria-describedby="ship-setting-firstLimitKm-error"><p class="field-error" id="ship-setting-firstLimitKm-error" th:errors="*{firstLimitKm}"></p></div><div class="catalog-field"><label for="ship-setting-secondLimitKm">Mốc khoảng cách thứ hai (km) *</label><input id="ship-setting-secondLimitKm" class="form-control" th:field="*{secondLimitKm}" type="number" required min="0" step="0.01" aria-describedby="ship-setting-secondLimitKm-error"><p class="field-error" id="ship-setting-secondLimitKm-error" th:errors="*{secondLimitKm}"></p></div><div class="catalog-field"><label for="ship-setting-firstFee">Phí nấc đầu (đ) *</label><input id="ship-setting-firstFee" class="form-control" th:field="*{firstFee}" type="number" required min="0" step="1" aria-describedby="ship-setting-firstFee-error"><p class="field-error" id="ship-setting-firstFee-error" th:errors="*{firstFee}"></p></div><div class="catalog-field"><label for="ship-setting-secondFee">Phí nấc thứ hai (đ) *</label><input id="ship-setting-secondFee" class="form-control" th:field="*{secondFee}" type="number" required min="0" step="1" aria-describedby="ship-setting-secondFee-error"><p class="field-error" id="ship-setting-secondFee-error" th:errors="*{secondFee}"></p></div><div class="catalog-field"><label for="ship-setting-fallbackFee">Phí xa/tạm tính (đ) *</label><input id="ship-setting-fallbackFee" class="form-control" th:field="*{fallbackFee}" type="number" required min="0" step="1" aria-describedby="ship-setting-fallbackFee-error"><p class="field-error" id="ship-setting-fallbackFee-error" th:errors="*{fallbackFee}"></p></div><div class="catalog-field"><label for="ship-setting-freeQuantity">Tổng số lượng được miễn phí *</label><input id="ship-setting-freeQuantity" class="form-control" th:field="*{freeQuantity}" type="number" required min="1" max="1000" step="1" aria-describedby="ship-setting-freeQuantity-error"><p class="field-error" id="ship-setting-freeQuantity-error" th:errors="*{freeQuantity}"></p></div><button type="submit" class="btn btn-primary">Lưu kho và phí vận chuyển</button></form></section><form novalidate method="get" action="/admin/shipping-times" class="admin-panel mb-3"><label for="regionFilter">Vùng giao hàng</label><select id="regionFilter" name="region" class="form-select"><option value="">Tất cả</option><option th:each="r:${regions}" th:value="${r.code}" th:selected="${region==r.code}" th:text="${r.name}"></option></select><button type="submit" class="btn btn-primary mt-2">Lọc</button></form>
<div class="admin-panel"><div class="data-table-scroll" role="region" aria-label="Thời gian giao hàng, cuộn ngang để xem đủ cột" tabindex="0"><table class="admin-table data-table"><thead><tr><th>STT</th><th>Vùng</th><th>Ngày tối thiểu</th><th>Ngày tối đa</th><th>Hành động</th></tr></thead><tbody><tr th:each="r,i:${regionPage.content}"><td th:text="${regionPage.number*regionPage.size+i.count}"></td><td th:text="${r.name}"></td><td><label class="visually-hidden" th:for="'min-'+${r.code}">Ngày tối thiểu</label><input class="form-control" type="number" min="1" max="30" required name="minDays" th:id="'min-'+${r.code}" th:form="'region-'+${r.code}" th:value="${r.minDays}" th:aria-describedby="'min-'+${r.code}+'-error'"><p class="field-error" th:id="'min-'+${r.code}+'-error'" aria-live="polite"></p></td><td><label class="visually-hidden" th:for="'max-'+${r.code}">Ngày tối đa</label><input class="form-control" type="number" min="1" max="30" required name="maxDays" th:id="'max-'+${r.code}" th:form="'region-'+${r.code}" th:value="${r.maxDays}" th:data-not-less-than="'min-'+${r.code}" th:aria-describedby="'max-'+${r.code}+'-error'"><p class="field-error" th:id="'max-'+${r.code}+'-error'" aria-live="polite"></p></td><td><form novalidate data-admin-form method="post" th:id="'region-'+${r.code}" th:action="@{/admin/shipping-times/{code}(code=${r.code})}"><p class="form-message" role="alert" hidden></p><button type="submit" class="btn btn-primary">Lưu</button></form></td></tr><tr th:if="${regionPage.empty}"><td colspan="5">Không có vùng phù hợp.</td></tr></tbody></table></div></div><nav th:replace="~{fragments/phan-trang :: phan-trang(${regionPage},'page')}"></nav>
</section></body></html>
