<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><h1>Cấu hình vận chuyển</h1></div></div>
<section class="admin-panel mb-4"><h2>Kho và phí vận chuyển</h2><p>Đường chim bay; miễn phí theo tổng số lượng. Thay đổi chỉ áp dụng khi tạo đơn mới.</p><form method="post" th:action="@{/admin/shipping-config/settings}" th:object="${shippingSettings}" data-admin-form novalidate class="shipping-settings-form"><p class="form-message" role="alert" hidden></p><div class="catalog-field"><label for="ship-setting-originAddress">Địa chỉ kho *</label><input id="ship-setting-originAddress" class="form-control" th:field="*{originAddress}" type="text" required aria-describedby="ship-setting-originAddress-error"><p class="field-error" id="ship-setting-originAddress-error" th:errors="*{originAddress}"></p></div><div class="catalog-field"><label for="ship-setting-originLatitude">Vĩ độ kho *</label><input id="ship-setting-originLatitude" class="form-control" th:field="*{originLatitude}" type="number" required min="-90" max="90" step="0.0000001" aria-describedby="ship-setting-originLatitude-error"><p class="field-error" id="ship-setting-originLatitude-error" th:errors="*{originLatitude}"></p></div><div class="catalog-field"><label for="ship-setting-originLongitude">Kinh độ kho *</label><input id="ship-setting-originLongitude" class="form-control" th:field="*{originLongitude}" type="number" required min="-180" max="180" step="0.0000001" aria-describedby="ship-setting-originLongitude-error"><p class="field-error" id="ship-setting-originLongitude-error" th:errors="*{originLongitude}"></p></div><div class="catalog-field"><label for="ship-setting-firstLimitKm">Mốc khoảng cách đầu (km) *</label><input id="ship-setting-firstLimitKm" class="form-control" th:field="*{firstLimitKm}" type="number" required min="0" step="0.01" aria-describedby="ship-setting-firstLimitKm-error"><p class="field-error" id="ship-setting-firstLimitKm-error" th:errors="*{firstLimitKm}"></p></div><div class="catalog-field"><label for="ship-setting-secondLimitKm">Mốc khoảng cách thứ hai (km) *</label><input id="ship-setting-secondLimitKm" class="form-control" th:field="*{secondLimitKm}" type="number" required min="0" step="0.01" aria-describedby="ship-setting-secondLimitKm-error"><p class="field-error" id="ship-setting-secondLimitKm-error" th:errors="*{secondLimitKm}"></p></div><div class="catalog-field"><label for="ship-setting-firstFee">Phí nấc đầu (đ) *</label><input id="ship-setting-firstFee" class="form-control" th:field="*{firstFee}" type="number" required min="0" step="1" aria-describedby="ship-setting-firstFee-error"><p class="field-error" id="ship-setting-firstFee-error" th:errors="*{firstFee}"></p></div><div class="catalog-field"><label for="ship-setting-secondFee">Phí nấc thứ hai (đ) *</label><input id="ship-setting-secondFee" class="form-control" th:field="*{secondFee}" type="number" required min="0" step="1" aria-describedby="ship-setting-secondFee-error"><p class="field-error" id="ship-setting-secondFee-error" th:errors="*{secondFee}"></p></div><div class="catalog-field"><label for="ship-setting-fallbackFee">Phí xa/tạm tính (đ) *</label><input id="ship-setting-fallbackFee" class="form-control" th:field="*{fallbackFee}" type="number" required min="0" step="1" aria-describedby="ship-setting-fallbackFee-error"><p class="field-error" id="ship-setting-fallbackFee-error" th:errors="*{fallbackFee}"></p></div><div class="catalog-field"><label for="ship-setting-freeQuantity">Tổng số lượng được miễn phí *</label><input id="ship-setting-freeQuantity" class="form-control" th:field="*{freeQuantity}" type="number" required min="1" max="1000" step="1" aria-describedby="ship-setting-freeQuantity-error"><p class="field-error" id="ship-setting-freeQuantity-error" th:errors="*{freeQuantity}"></p></div><button type="submit" class="btn btn-primary">Lưu kho và phí vận chuyển</button></form></section>
</section></body></html>
