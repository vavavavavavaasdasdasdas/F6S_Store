<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">ĐIỀU CHỈNH TỒN KHO</span><h1 th:text="${item.product.name}"></h1><p class="admin-description" th:text="'Kích cỡ '+${item.size.sizeValue}+' · '+${item.material.name}+' · Tồn hiện tại: '+${item.quantity}"></p></div></div>
<p>Màu sắc: <span th:text="${item.color.name}"></span></p><p>Đế giày: <span th:text="${item.sole.name}"></span></p><form class="admin-panel catalog-form catalog-form-narrow" th:action="@{/admin/inventory/adjust}" th:object="${adjustment}" method="post" novalidate data-admin-form><input type="hidden" th:field="*{variantId}"><input type="hidden" th:field="*{expectedQuantity}"><p class="form-message" role="alert" hidden></p>
<div class="catalog-field"><label for="mode">Cách điều chỉnh *</label><select class="form-select" th:field="*{mode}" id="mode" required aria-describedby="mode-error"><option value="ADD">Nhập thêm vào kho</option><option value="SET">Chỉnh tồn kho thực tế</option></select><p class="field-error" id="mode-error"><span th:if="${#fields.hasErrors('mode')}" th:errors="*{mode}"></span></p></div>
<div class="catalog-field"><label for="quantity">Số lượng *</label><input type="number" class="form-control" id="quantity" th:field="*{quantity}" required min="0" max="2147483647" step="1" aria-describedby="quantity-error quantity-help"><p class="field-error" id="quantity-error"><span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span></p><p id="quantity-help" class="field-help">Nhập thêm: số lượng cộng vào kho (&gt; 0). Chỉnh thực tế: số lượng còn lại sau kiểm kê (≥ 0).</p></div>
<div class="catalog-field"><label for="reason">Lý do *</label><textarea class="resize-none form-control" id="reason" th:field="*{reason}" required maxlength="500" rows="4" aria-describedby="reason-error"></textarea><p class="field-error" id="reason-error"><span th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></span></p></div>
<div class="catalog-form-actions"><button class="btn btn-primary" type="submit">Lưu điều chỉnh</button><a class="btn btn-outline-secondary" th:href="@{/admin/inventory}">Quay lại tồn kho</a><a class="btn btn-link" th:href="@{/admin/inventory/adjust/{id}(id=${item.id})}">Tải lại tồn kho</a></div></form></section></body></html>
