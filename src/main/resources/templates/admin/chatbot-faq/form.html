<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}">
<body>
<section>
    <div class="admin-heading mb-3">
        <h1 class="h3 mb-0" th:text="${isNew ? 'Thêm câu hỏi kiến thức chatbot' : 'Cập nhật kiến thức chatbot'}"></h1>
    </div>

    <div class="admin-panel" style="max-width: 800px;">
        <form th:action="@{/admin/chatbot-faq/save}" th:object="${faq}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="ma" class="form-label">Mã kiến thức</label>
                <input type="text" id="ma" th:field="*{ma}" class="form-control" readonly style="background-color: #f8f9fa;">
            </div>

            <div class="mb-3">
                <label for="cauHoi" class="form-label">Câu hỏi thường gặp <span class="text-danger">*</span></label>
                <input type="text" id="cauHoi" th:field="*{cauHoi}" class="form-control"
                       placeholder="Ví dụ: Chính sách đổi trả hàng như thế nào?" required maxlength="300">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cauHoi')}" th:errors="*{cauHoi}"></div>
            </div>

            <div class="mb-3">
                <label for="tuKhoa" class="form-label">Từ khóa nhận diện (ngăn cách bằng dấu phẩy)</label>
                <input type="text" id="tuKhoa" th:field="*{tuKhoa}" class="form-control"
                       placeholder="Ví dụ: đổi trả, doi tra, trả hàng, hoàn tiền, bao lâu" maxlength="300">
                <div class="form-text">Các từ khóa giúp chatbot nhận diện câu hỏi nhanh chóng cả khi có dấu hoặc không dấu.</div>
            </div>

            <div class="mb-3">
                <label for="traLoi" class="form-label">Câu trả lời của Chatbot <span class="text-danger">*</span></label>
                <textarea id="traLoi" th:field="*{traLoi}" class="form-control" rows="5"
                          placeholder="Nhập nội dung câu trả lời chi tiết và thân thiện..." required maxlength="1500"></textarea>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('traLoi')}" th:errors="*{traLoi}"></div>
            </div>

            <div class="mb-4 form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="hienThi" th:field="*{hienThi}">
                <label class="form-check-label" for="hienThi">Kích hoạt hiển thị cho chatbot</label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Lưu kiến thức
                </button>
                <a th:href="@{/admin/chatbot-faq}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
