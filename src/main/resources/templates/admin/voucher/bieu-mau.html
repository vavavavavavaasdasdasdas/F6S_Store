<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><h1 th:text="${voucher.id==null ? 'Tạo phiếu giảm giá' : 'Sửa phiếu giảm giá'}"></h1></div></div><form class="admin-panel catalog-form" data-admin-form data-discount-form="voucher" novalidate method="post" th:action="@{/admin/vouchers/save}" th:object="${voucher}"><input type="hidden" th:field="*{id}"><p class="form-message" hidden role="alert"></p><div class="catalog-form-grid"><div class="catalog-field"><label for="code">Mã phiếu giảm giá *</label><input class="form-control" id="code" type="text" th:field="*{code}" required maxlength="50" pattern="[A-Za-z0-9_\-]{1,50}" aria-describedby="code-error"><p class="field-error" id="code-error" aria-live="polite"><span th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span></p></div>
<div class="catalog-field"><label for="name">Tên phiếu giảm giá *</label><input class="form-control" id="name" type="text" th:field="*{name}" required maxlength="100" aria-describedby="name-error"><p class="field-error" id="name-error" aria-live="polite"><span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></p></div>
<div class="catalog-field"><label for="discountType">Loại giảm *</label><select class="form-select" id="discountType" th:field="*{discountType}" required aria-describedby="discountType-error"><option value="PERCENT">Phần trăm (%)</option><option value="FIXED">Số tiền cố định (đ)</option></select><p class="field-error" id="discountType-error" aria-live="polite"><span th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}"></span></p></div>
<div class="catalog-field"><label for="discountValue">Giá trị giảm *</label><input class="form-control" id="discountValue" type="number" th:field="*{discountValue}" required min="0.01" step="0.01" aria-describedby="discountValue-error"><p class="field-error" id="discountValue-error" aria-live="polite"><span th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></span></p></div>
<div class="catalog-field"><label for="minOrderValue">Giá trị đơn tối thiểu (đ)</label><input class="form-control" id="minOrderValue" type="number" th:field="*{minOrderValue}" min="0" step="0.01" aria-describedby="minOrderValue-error"><p class="field-error" id="minOrderValue-error" aria-live="polite"><span th:if="${#fields.hasErrors('minOrderValue')}" th:errors="*{minOrderValue}"></span></p></div>
<div data-percent-only><div class="catalog-field"><label for="maxDiscount">Giảm tối đa (đ)</label><input class="form-control" id="maxDiscount" type="number" th:field="*{maxDiscount}" min="0.01" step="0.01" aria-describedby="maxDiscount-error"><p class="field-error" id="maxDiscount-error" aria-live="polite"><span th:if="${#fields.hasErrors('maxDiscount')}" th:errors="*{maxDiscount}"></span></p></div>
</div><div class="catalog-field"><label for="startDate">Bắt đầu *</label><input class="form-control" id="startDate" type="datetime-local" step="any" th:field="*{startDate}" required aria-describedby="startDate-error"><p class="field-error" id="startDate-error" aria-live="polite"><span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span></p></div>
<div class="catalog-field"><label for="endDate">Kết thúc *</label><input class="form-control" id="endDate" type="datetime-local" step="any" th:field="*{endDate}" required aria-describedby="endDate-error"><p class="field-error" id="endDate-error" aria-live="polite"><span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span></p></div>
<div class="catalog-field"><label for="usageLimit">Giới hạn lượt dùng</label><input class="form-control" id="usageLimit" type="number" th:field="*{usageLimit}" min="1" step="1" aria-describedby="usageLimit-error"><p class="field-error" id="usageLimit-error" aria-live="polite"><span th:if="${#fields.hasErrors('usageLimit')}" th:errors="*{usageLimit}"></span></p></div>
<div><p th:if="${usedCount!=null}" th:text="'Đã dùng: '+${usedCount}"></p></div><div class="catalog-field"><label for="isPublic">Phạm vi *</label><select class="form-select" id="isPublic" th:field="*{isPublic}" required aria-describedby="isPublic-error"><option value="true">Công khai</option><option value="false">Riêng tư cho một khách</option></select><p class="field-error" id="isPublic-error" aria-live="polite"><span th:if="${#fields.hasErrors('isPublic')}" th:errors="*{isPublic}"></span></p></div>
<div data-private-only><div class="catalog-field"><label for="customerId">Khách hàng *</label><select class="form-select" id="customerId" th:field="*{customerId}"  aria-describedby="customerId-error"><option value="">Chọn khách hàng</option><option th:each="c:${customers}" th:value="${c.id}" th:text="${c.fullName}+' · '+${c.phone}"></option></select><p class="field-error" id="customerId-error" aria-live="polite"><span th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></span></p></div>
</div><div class="catalog-field"><label for="status">Trạng thái *</label><select class="form-select" id="status" th:field="*{status}" required aria-describedby="status-error"><option value="true">Hoạt động</option><option value="false">Đã khóa</option></select><p class="field-error" id="status-error" aria-live="polite"><span th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span></p></div>
</div><div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu phiếu giảm giá</button><a class="btn btn-outline-secondary" href="/admin/vouchers">Quay lại danh sách</a></div></form><script src="/js/quan-tri-giam-gia.js" defer></script></section></body></html>
