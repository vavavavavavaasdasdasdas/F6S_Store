<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><h1>Phiếu giảm giá</h1></div><a class="btn btn-primary" href="/admin/vouchers/create" data-add-icon>Thêm phiếu giảm giá</a></div><div class="admin-panel">
<form class="catalog-filters mb-3" method="get" action="/admin/vouchers" novalidate>
<div><label for="keyword">Từ khóa</label><div class="search-control"><input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Mã hoặc tên phiếu giảm giá" maxlength="100"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div>
<div><label for="discountType">Loại giảm</label><select class="form-select" id="discountType" name="discountType"><option value="">Tất cả loại</option><option value="PERCENT" th:selected="${discountType=='PERCENT'}">Phần trăm (%)</option><option value="FIXED" th:selected="${discountType=='FIXED'}">Số tiền (đ)</option></select></div>
<div><label for="voucher-state">Hiệu lực</label><select class="form-select" id="voucher-state" name="state"><option value="">Tất cả trạng thái</option><option value="RUNNING" th:selected="${state=='RUNNING'}">Đang chạy</option><option value="UPCOMING" th:selected="${state=='UPCOMING'}">Sắp diễn ra</option><option value="EXPIRED" th:selected="${state=='EXPIRED'}">Hết hạn</option><option value="INACTIVE" th:selected="${state=='INACTIVE'}">Tạm dừng</option></select></div>
<div><label for="voucher-from">Từ ngày</label><input class="form-control" type="date" id="voucher-from" name="from" th:value="${from}"></div>
<div><label for="voucher-to">Đến ngày</label><input class="form-control" type="date" id="voucher-to" name="to" th:value="${to}"></div>
<div class="filter-actions"><button class="btn btn-outline-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" href="/admin/vouchers">Xóa lọc</a><span class="filter-status-badge" data-filter-count th:text="${activeFilterCount > 0 ? 'Đang lọc: ' + activeFilterCount + ' bộ lọc' : 'Chưa áp dụng bộ lọc'}"></span></div>
</form>
<div class="table-wrap" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem đủ cột" tabindex="0"><table data-table-key="admin-voucher-danh-sach-1" class="admin-table data-table"><thead><tr><th class="row-number">STT</th><th>Mã</th><th>Tên</th><th>Loại giảm</th><th>Giá trị</th><th>Đơn tối thiểu</th><th>Giảm tối đa</th><th>Bắt đầu</th><th>Kết thúc</th><th>Đã dùng</th><th>Hoạt động</th><th>Hành động</th></tr></thead><tbody><tr th:each="p,rowIndex:${vouchers}"><td class="row-number" th:text="${dataPage.number*dataPage.size+rowIndex.count}"></td><td th:text="${p.code}"></td><td th:text="${p.name}"></td><td th:text="${p.discountType=='PERCENT'?'Phần trăm':'Số tiền'}"></td><td th:text="${p.discountValue}"></td><td th:text="${@money.format(p.minOrderValue)}"></td><td th:text="${p.discountType=='PERCENT' and p.maxDiscount!=null?@money.format(p.maxDiscount):'—'}"></td><td th:text="${#temporals.format(p.startDate,'dd/MM/yyyy HH:mm')}"></td><td th:text="${#temporals.format(p.endDate,'dd/MM/yyyy')}"></td><td th:text="${p.usedCount?:0}"></td><td><form novalidate th:replace="~{fragments/cong-tac-khuyen-mai :: switch('vouchers',${p.id},${p.status},${discountEffectivity.label(discountEffectivity.voucherState(p))})}"></form></td><td><a th:href="@{/admin/vouchers/edit/{id}(id=${p.id})}">Sửa</a></td></tr><tr th:if="${#lists.isEmpty(vouchers)}"><td colspan="12">Không tìm thấy phiếu giảm giá phù hợp.</td></tr></tbody></table></div></div><nav th:replace="~{fragments/phan-trang :: phan-trang(${dataPage},'page')}"></nav><script src="/js/quan-tri-giam-gia.js" defer></script></section></body></html>
