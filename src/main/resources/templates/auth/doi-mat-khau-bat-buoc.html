<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu lần đầu</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/he-thong-thiet-ke.css}"></head>
<body><main style="max-width:520px;margin:40px auto;padding:20px;overflow-wrap:anywhere"><h1>Đổi mật khẩu lần đầu</h1><p>Bạn cần đổi mật khẩu tạm trước khi tiếp tục sử dụng tài khoản.</p>
<form method="post" th:action="@{/account/change-required}" th:object="${passwordForm}">
<label for="currentPassword">Mật khẩu tạm</label><input id="currentPassword" class="form-control" type="password" name="currentPassword" value="" required autocomplete="current-password" maxlength="72"><p th:errors="*{currentPassword}"></p>
<label for="newPassword">Mật khẩu mới</label><input id="newPassword" class="form-control" type="password" name="newPassword" value="" required autocomplete="new-password" minlength="8" maxlength="72"><p>Từ 8 ký tự, có chữ và số, tối đa 72 byte UTF-8.</p><p th:errors="*{newPassword}"></p>
<label for="confirmPassword">Xác nhận mật khẩu mới</label><input id="confirmPassword" class="form-control" type="password" name="confirmPassword" value="" required autocomplete="new-password" maxlength="72"><p th:errors="*{confirmPassword}"></p>
<button class="btn btn-primary" type="submit">Đổi mật khẩu</button></form>
<form method="post" th:action="@{/logout}" class="mt-3"><button class="btn btn-outline-secondary" type="submit">Đăng xuất</button></form>
</main></body></html>
