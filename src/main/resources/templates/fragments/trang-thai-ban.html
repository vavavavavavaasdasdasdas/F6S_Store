<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<form th:fragment="button(kind,id,selling)" method="post" th:action="${kind=='product'} ? @{/admin/products-crud/status/{id}(id=${id})} : @{/admin/variants/status/{id}(id=${id})}">
<input type="hidden" name="selling" th:value="${selling!=true}">
<button class="btn btn-sm btn-outline-secondary" type="button" data-confirm
 th:text="${selling==true ? 'Ngừng bán' : 'Bán lại'}"
 th:attr="data-confirm-title=${selling==true ? 'Ngừng bán?' : 'Bán lại?'},data-confirm-message=${kind=='product' ? (selling==true ? 'Sản phẩm sẽ ẩn khỏi cửa hàng và POS. Giỏ hàng, hóa đơn chờ có sản phẩm này sẽ bị chặn thanh toán. Trạng thái biến thể, tồn kho và lịch sử được giữ nguyên.' : 'Sản phẩm được bán lại với đúng trạng thái từng biến thể trước đó. Tồn kho và lịch sử được giữ nguyên.') : (selling==true ? 'Biến thể này không thể thêm vào giỏ hoặc thanh toán. Tồn kho và lịch sử được giữ nguyên.' : 'Biến thể được bán lại khi sản phẩm đang bán. Tồn kho và lịch sử được giữ nguyên.')}"></button>
</form>

<!-- Generic switch -->
<form th:fragment="toggleSwitch(actionUrl, id, active, name, targetLabel, disabled, disabledReason)"
      method="post"
      th:action="${actionUrl}"
      class="d-inline-flex align-items-center catalog-switch-form"
      data-catalog-switch="common"
      th:attr="data-confirm-title=${'Tắt ' + targetLabel + '?'},data-confirm-off=${'Khi tắt, ' + targetLabel + ' &quot;' + name + '&quot; sẽ không còn hiển thị cho khách chọn và không áp dụng cho đơn mới. Đơn cũ giữ nguyên.'}">
    <input type="hidden" name="active" th:value="${active==true}">
    <input type="hidden" name="selling" th:value="${active==true}">
    <input type="hidden" name="enabled" th:value="${active==true}">
    <label class="discount-switch"
           th:title="${disabled==true ? disabledReason : (active==true ? 'Đang hoạt động — bấm để tắt' : 'Đã tắt — bấm để bật lại')}">
        <input type="checkbox"
               role="switch"
               th:checked="${active==true}"
               th:disabled="${disabled==true}"
               th:attr="aria-checked=${active==true ? 'true' : 'false'},aria-label=${'Trạng thái hoạt động ' + targetLabel + ' ' + name}">
        <span class="discount-switch-track" aria-hidden="true"></span>
        <span class="visually-hidden" data-switch-text th:text="${active==true ? 'Đang hoạt động' : 'Đã tắt'}"></span>
    </label>
</form>

<form th:fragment="productSwitch(id,selling,name)" method="post" th:action="@{/admin/products-crud/status/{id}(id=${id})}" class="d-inline-flex align-items-center catalog-switch-form" data-catalog-switch="product"
 th:attr="data-confirm-title='Ngừng bán sản phẩm?',data-confirm-off=${'Khi tắt, sản phẩm &quot;' + name + '&quot; sẽ không còn hiển thị cho khách chọn và không áp dụng cho đơn mới. Đơn cũ giữ nguyên.'}">
<input type="hidden" name="selling" th:value="${selling==true}"><input type="hidden" name="active" th:value="${selling==true}">
<label class="discount-switch" th:title="${selling==true ? 'Đang bán — bấm để ngừng bán' : 'Ngừng bán — bấm để bán lại'}">
<input type="checkbox" role="switch" th:checked="${selling==true}" th:attr="aria-checked=${selling==true ? 'true' : 'false'},aria-label=${'Trạng thái bán ' + name}">
<span class="discount-switch-track" aria-hidden="true"></span>
<span class="visually-hidden" data-switch-text th:text="${selling==true ? 'Đang bán' : 'Ngừng bán'}"></span>
</label>
</form>

<form th:fragment="variantSwitch(id,selling,name)" method="post" th:action="@{/admin/variants/status/{id}(id=${id})}" class="d-inline-flex align-items-center catalog-switch-form" data-catalog-switch="variant"
 th:attr="data-confirm-title='Ngừng bán biến thể?',data-confirm-off=${'Khi tắt, biến thể &quot;' + name + '&quot; sẽ không còn hiển thị cho khách chọn và không áp dụng cho đơn mới. Đơn cũ giữ nguyên.'}">
<input type="hidden" name="selling" th:value="${selling==true}"><input type="hidden" name="active" th:value="${selling==true}">
<label class="discount-switch" th:title="${selling==true ? 'Đang bán — bấm để ngừng bán' : 'Ngừng bán — bấm để bán lại'}">
<input type="checkbox" role="switch" th:checked="${selling==true}" th:attr="aria-checked=${selling==true ? 'true' : 'false'},aria-label=${'Trạng thái bán biến thể ' + name}">
<span class="discount-switch-track" aria-hidden="true"></span>
<span class="visually-hidden" data-switch-text th:text="${selling==true ? 'Đang bán' : 'Ngừng bán'}"></span>
</label>
</form>

<form th:fragment="categorySwitch(id,active,name)" method="post" th:action="@{/admin/categories/toggle-status/{id}(id=${id})}" class="d-inline-flex align-items-center catalog-switch-form" data-catalog-switch="category"
 th:attr="data-confirm-title='Tắt thương hiệu?',data-confirm-off=${'Khi tắt, thương hiệu &quot;' + name + '&quot; sẽ không còn hiển thị cho khách chọn và không áp dụng cho đơn mới. Đơn cũ giữ nguyên.'}">
<input type="hidden" name="active" th:value="${active==true}"><input type="hidden" name="selling" th:value="${active==true}">
<label class="discount-switch" th:title="${active==true ? 'Đang hiển thị — bấm để tắt' : 'Đã tắt — bấm để bật lại'}">
<input type="checkbox" role="switch" th:checked="${active==true}" th:attr="aria-checked=${active==true ? 'true' : 'false'},aria-label=${'Trạng thái hiển thị ' + name}">
<span class="discount-switch-track" aria-hidden="true"></span>
<span class="visually-hidden" data-switch-text th:text="${active==true ? 'Đang hiển thị' : 'Đã tắt'}"></span>
</label>
</form>

<form th:fragment="lookupSwitch(kind,id,active,name,labelName)" method="post" th:action="@{/admin/{kind}/toggle-status/{id}(kind=${kind},id=${id})}" class="d-inline-flex align-items-center catalog-switch-form" data-catalog-switch="lookup"
 th:attr="data-confirm-title=${'Tắt ' + labelName + '?'},data-confirm-off=${'Khi tắt, ' + labelName + ' &quot;' + name + '&quot; sẽ không còn hiển thị cho khách chọn và không áp dụng cho đơn mới. Đơn cũ giữ nguyên.'}">
<input type="hidden" name="active" th:value="${active==true}"><input type="hidden" name="selling" th:value="${active==true}">
<label class="discount-switch" th:title="${active==true ? 'Đang hiển thị — bấm để tắt' : 'Đã tắt — bấm để bật lại'}">
<input type="checkbox" role="switch" th:checked="${active==true}" th:attr="aria-checked=${active==true ? 'true' : 'false'},aria-label=${'Trạng thái hiển thị ' + labelName + ' ' + name}">
<span class="discount-switch-track" aria-hidden="true"></span>
<span class="visually-hidden" data-switch-text th:text="${active==true ? 'Đang hiển thị' : 'Đã tắt'}"></span>
</label>
</form>

<form th:fragment="customerSwitch(id,active,name,isSelf)" method="post" th:action="@{/admin/customers/status/{id}(id=${id})}" class="d-inline-flex align-items-center catalog-switch-form" data-catalog-switch="customer"
 th:attr="data-confirm-title='Vô hiệu hóa khách hàng?',data-confirm-off=${'Khi tắt, tài khoản của khách hàng &quot;' + name + '&quot; sẽ bị khóa ngay lập tức. Đơn hàng cũ giữ nguyên.'}">
<input type="hidden" name="enabled" th:value="${active==true}"><input type="hidden" name="active" th:value="${active==true}">
<label class="discount-switch" th:title="${isSelf==true ? 'Không thể tự tắt tài khoản của chính mình' : (active==true ? 'Đang hoạt động — bấm để tắt' : 'Đã tắt — bấm để bật lại')}">
<input type="checkbox" role="switch" th:checked="${active==true}" th:disabled="${isSelf==true}" th:attr="aria-checked=${active==true ? 'true' : 'false'},aria-label=${'Trạng thái hoạt động khách hàng ' + name}">
<span class="discount-switch-track" aria-hidden="true"></span>
<span class="visually-hidden" data-switch-text th:text="${active==true ? 'Đang hoạt động' : 'Đã tắt'}"></span>
</label>
</form>

<form th:fragment="employeeSwitch(id,active,name,isSelf,isLastAdmin)" method="post" th:action="@{/admin/employees/status/{id}(id=${id})}" class="d-inline-flex align-items-center catalog-switch-form" data-catalog-switch="employee"
 th:attr="data-confirm-title='Vô hiệu hóa nhân viên?',data-confirm-off=${'Khi tắt, tài khoản của nhân viên &quot;' + name + '&quot; sẽ bị khóa ngay lập tức và đăng xuất. Lịch sử làm việc được giữ nguyên.'}">
<input type="hidden" name="enabled" th:value="${active==true}"><input type="hidden" name="active" th:value="${active==true}">
<label class="discount-switch" th:title="${isSelf==true ? 'Không thể tự tắt tài khoản của chính mình' : (isLastAdmin==true ? 'Hệ thống phải có ít nhất 1 Admin hoạt động' : (active==true ? 'Đang hoạt động — bấm để tắt' : 'Đã tắt — bấm để bật lại'))}">
<input type="checkbox" role="switch" th:checked="${active==true}" th:disabled="${isSelf==true or isLastAdmin==true}" th:attr="aria-checked=${active==true ? 'true' : 'false'},aria-label=${'Trạng thái hoạt động nhân viên ' + name}">
<span class="discount-switch-track" aria-hidden="true"></span>
<span class="visually-hidden" data-switch-text th:text="${active==true ? 'Đang hoạt động' : 'Đã tắt'}"></span>
</label>
</form>
</body></html>
