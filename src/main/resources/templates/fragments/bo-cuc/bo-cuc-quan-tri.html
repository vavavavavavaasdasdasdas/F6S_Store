<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${adminTitle} + ' | F6S Store'">F6S Store</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon-32.png}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/he-thong-thiet-ke.css}">
    <link rel="stylesheet" th:href="@{/css/quan-tri.css}">
    <link rel="stylesheet" th:href="@{/css/admin-chatbot.css}">
    <script th:src="@{/js/combo-box.js}" defer></script>
    <script th:src="@{/js/quan-tri.js}" defer></script>
    <script th:src="@{/js/quan-tri-danh-muc.js}" defer></script>
    <script th:src="@{/js/o-nhap-so.js}" defer></script>
    <script src="/js/vendor/sockjs-1.6.1.min.js" defer></script><script src="/js/vendor/stomp-7.2.1.min.js" defer></script><script src="/js/support-chat-view.js" defer></script><script src="/js/staff-chat-connection.js" defer></script>
    <script th:src="@{/js/admin-chatbot.js}" defer></script>
<link rel="apple-touch-icon" href="/images/favicon-180.png">
<th:block th:replace="~{fragments/nut-hanh-dong :: library}"></th:block><script src="/js/nut-hanh-dong.js" defer></script></head>
<body class="admin-body" th:classappend="${adminActive=='dashboard' ? ' is-dashboard' : ' not-dashboard'}">
<dialog id="admin-confirm" class="catalog-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <h2 id="confirm-title">Xác nhận thao tác</h2><p id="confirm-description"></p>
    <div class="catalog-form-actions"><button type="button" class="btn btn-outline-secondary" data-dialog-cancel autofocus>Hủy</button><button type="button" class="btn btn-danger" data-dialog-accept>Xác nhận</button></div>
</dialog>
<a class="admin-skip" href="#admin-content">Đến nội dung chính</a>
<aside th:replace="~{fragments/thanh-ben-quan-tri :: sidebar}"></aside>
<button class="admin-backdrop" aria-label="Đóng menu" tabindex="-1" hidden></button>
<button th:unless="${adminActive=='dashboard'}" id="admin-menu-toggle-fixed" class="admin-menu-toggle-fixed" type="button" aria-label="Mở menu quản trị" aria-controls="admin-sidebar" aria-expanded="false" data-admin-menu-toggle>☰</button>
<div class="admin-shell">
    <th:block th:if="${adminActive=='dashboard'}">
        <header th:replace="~{fragments/thanh-dau-quan-tri :: topbar}"></header>
    </th:block>
    <main id="admin-content" class="admin-content" tabindex="-1">
        <div th:replace="~{fragments/thong-bao-quan-tri :: flash}"></div>
        <th:block th:replace="${content}"></th:block>
    </main>
    <footer class="admin-footer">F6S · Không gian quản trị</footer>
</div>
<th:block th:replace="~{fragments/admin-chatbot :: widget}"></th:block>
</body>
</html>
