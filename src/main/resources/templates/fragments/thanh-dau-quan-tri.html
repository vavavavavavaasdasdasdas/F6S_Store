    <span class="topbar-label">Không gian quản trị</span></div>
    <div class="d-flex align-items-center gap-2 flex-wrap"><a class="admin-user" th:href="@{/admin/account}" aria-label="Hồ sơ của tôi"><span class="admin-avatar" aria-hidden="true">A</span><span th:text="${#authentication.name}">Admin</span><span class="admin-role">Hồ sơ của tôi</span></a><form th:action="@{/logout}" method="post" novalidate><button class="btn btn-sm btn-outline-secondary" type="submit">Đăng xuất</button></form></div>
