<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="topbar" id="admin-header" class="admin-topbar" th:if="${adminActive=='dashboard'}">
    <div class="topbar-start"><button id="admin-menu-toggle" type="button" aria-label="Mở menu quản trị" aria-controls="admin-sidebar" aria-expanded="false">☰</button>
    <span class="topbar-label">Không gian quản trị</span></div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
        <div class="admin-user" aria-label="Người dùng hiện tại"><span class="admin-avatar" aria-hidden="true">A</span><span th:text="${#authentication.name}">Admin</span></div>
        <form th:action="@{/logout}" method="post" novalidate><button class="btn btn-sm btn-outline-secondary" type="submit">Đăng xuất</button></form>
    </div>
</header></body></html>
