<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="summary(order)" th:if="${order.orderType=='ONLINE'}" class="delivery-snapshot mt-3 mb-3"><th:block th:if="${order.shippingFee != null and order.shippingFee > 0}"><p>Phí vận chuyển: <strong th:text="${order.freeShip==true?'Miễn phí vận chuyển':@money.format(order.shippingFee)+' đ'}"></strong></p><p th:if="${order.distanceKm!=null}">Khoảng cách: <span th:text="${@money.format(order.distanceKm)+' km (đường chim bay)'}"></span></p><p th:if="${order.shippingNote!=null}" th:text="${order.shippingNote}"></p></th:block><th:block th:unless="${order.shippingFee != null and order.shippingFee > 0}"><p class="small text-muted mb-0"><i class="bi bi-info-circle me-1"></i>Phí vận chuyển do đơn vị vận chuyển tính và thu riêng</p></th:block></section></body></html>
