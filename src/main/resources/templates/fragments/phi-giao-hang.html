<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="summary(order)" th:if="${order.orderType=='ONLINE'}" class="delivery-snapshot mt-3 mb-3"><p>Phí vận chuyển: <strong th:text="${order.freeShip==true?'Miễn phí vận chuyển':@money.format(order.shippingFee)+' đ'}"></strong></p><p>Khoảng cách: <span th:text="${order.distanceKm==null?'Chưa xác định':@money.format(order.distanceKm)+' km (đường chim bay)'}"></span></p><p th:if="${order.shippingNote!=null}" th:text="${order.shippingNote}"></p></section></body></html>
