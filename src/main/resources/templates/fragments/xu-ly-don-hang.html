<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="panel(order,allowedStatuses,actionBase)"><div class="admin-panel"><div class="panel-heading"><h2>Xử lý đơn hàng</h2><span class="status-pill" th:data-status="${order.status}" th:text="${statusLabels[order.status] ?: order.status}"></span></div><p>Tồn kho: <strong th:text="${order.daTruKho == true ? 'Đã trừ kho' : 'Chưa trừ kho'}"></strong></p><p th:if="${order.paymentReference!=null}">Mã đối soát: <strong th:text="${order.paymentReference}"></strong></p><p>Thanh toán: <strong th:text="${order.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></strong></p>
<form th:if="${order.status!='CANCELLED' && order.status!='DELIVERY_FAILED' && order.paymentStatus!='PAID' && (order.paymentMethod=='TRANSFER' || order.paymentMethod=='BANK_TRANSFER')}" th:action="${actionBase+'/confirm-payment'}" method="post" class="mb-3" novalidate><button type="button" class="btn btn-primary" data-confirm data-confirm-title="Xác nhận thanh toán" data-confirm-message="Đã nhận đủ tiền chuyển khoản của đơn này?">Xác nhận đã nhận chuyển khoản</button></form>
<form th:if="${order.orderType=='POS' and !allowedStatuses.empty}" th:action="${actionBase+'/status'}" method="post" novalidate><label for="nextStatus">Chuyển trạng thái</label><div class="input-group"><select id="nextStatus" name="status" class="form-select"><option th:each="s:${allowedStatuses}" th:value="${s}" th:text="${statusLabels.get(s)}"></option></select><button type="button" class="btn btn-primary" data-confirm data-confirm-title="Cập nhật trạng thái đơn" data-confirm-message="Hủy hoặc giao thất bại sẽ hoàn hàng nếu đơn đã trừ kho. Tiếp tục?">Cập nhật</button></div></form><div th:if="${order.orderType=='ONLINE' and !allowedStatuses.empty}" class="d-flex gap-2 flex-wrap"><button type="button" class="btn" th:classappend="${next=='CANCELLED' or next=='DELIVERY_FAILED'?'btn-outline-danger':'btn-primary'}" th:each="next:${allowedStatuses}" th:data-transition="${next}" th:text="${next=='CONFIRMED'?'Xác nhận đơn':next=='PREPARING'?'Bắt đầu chuẩn bị hàng':next=='SHIPPING'?'Giao cho đơn vị vận chuyển':next=='DELIVERED'?'Xác nhận đã giao':next=='CANCELLED'?'Hủy đơn':'Giao hàng thất bại'}"></button></div><p th:if="${allowedStatuses.empty}" class="sales-muted">Đơn đã kết thúc xử lý.</p></div></th:block>
<th:block th:fragment="province(order,allowedStatuses,actionBase)"><div class="admin-panel mt-3" id="order-province" th:if="${order.orderType=='ONLINE' and (order.status=='PENDING' or order.status=='CONFIRMED' or order.status=='PREPARING')}"><h3>Tỉnh/Thành phố giao hàng</h3><form novalidate data-admin-form method="post" th:action="${actionBase+'/province'}"><label for="order-province-id">Tỉnh/Thành phố *</label><select id="order-province-id" name="provinceId" required class="form-select" aria-describedby="order-province-id-error"><option value="">Chọn Tỉnh/Thành phố</option><option th:each="p:${provinces}" th:value="${p.id}" th:selected="${order.province!=null and p.id==order.province.id}" th:text="${p.name}"></option></select><p class="field-error" id="order-province-id-error" aria-live="polite"></p><p class="form-message" role="alert" hidden></p><button type="submit" class="btn btn-primary mt-2">Lưu tỉnh/thành</button></form></div></th:block>
<th:block th:fragment="dialog(order,allowedStatuses,actionBase)"><dialog id="order-transition-dialog" class="admin-dialog" aria-labelledby="order-transition-title"><form novalidate data-admin-form method="post" th:action="${actionBase+'/status'}"><h3 id="order-transition-title" data-transition-title>Xử lý đơn hàng</h3><p>Thao tác sẽ được ghi vào lịch sử. Hủy hoặc giao thất bại sẽ hoàn kho theo quy tắc hiện có.</p><input type="hidden" name="status"><div data-shipping-fields hidden><label for="order-carrier">Đơn vị vận chuyển (tùy chọn)</label><input class="form-control" id="order-carrier" name="carrier" maxlength="100" aria-describedby="order-carrier-error"><p class="field-error" id="order-carrier-error" aria-live="polite"></p><label for="order-tracking">Mã vận đơn (tùy chọn)</label><input class="form-control" id="order-tracking" name="trackingCode" maxlength="100" aria-describedby="order-tracking-error"><p class="field-error" id="order-tracking-error" aria-live="polite"></p></div><div data-reason-field hidden><label for="order-reason">Lý do *</label><textarea class="form-control resize-none" rows="3" aria-describedby="order-reason-error" id="order-reason" name="reason" maxlength="900"></textarea><p class="field-error" id="order-reason-error" aria-live="polite"></p></div><p class="form-message" role="alert" hidden></p><div class="d-flex gap-2 mt-3"><button type="submit" class="btn btn-primary">Xác nhận</button><button type="button" class="btn btn-outline-secondary" data-close-transition>Quay lại</button></div></form></dialog><script src="/js/theo-doi-don-hang.js" defer></script></th:block></body></html>
