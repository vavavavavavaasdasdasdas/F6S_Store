<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="widget" id="f6s-admin-chatbot-container" class="admin-chatbot-container">
    <!-- Nút nổi góc phải dưới -->
    <button id="admin-chatbot-toggle-btn" class="admin-chatbot-toggle-btn" type="button"
            aria-label="Mở Trợ lý cửa hàng" aria-expanded="false" aria-controls="admin-chatbot-window">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.58 26.58 0 0 0 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.933.933 0 0 1-.765.935c-.845.147-2.34.346-4.235.346-1.895 0-3.39-.2-4.235-.346A.933.933 0 0 1 3 9.219V8.062Zm4.542-.827a.25.25 0 0 0-.217.068l-.92.9a24.767 24.767 0 0 1-1.879-.18.53.53 0 0 1-.402-.322l-.167-.4a.25.25 0 0 0-.456.095l-.13.91a.5.5 0 0 0 .361.545c.883.218 2.062.33 3.328.33 1.266 0 2.445-.112 3.328-.33a.5.5 0 0 0 .36-.545l-.13-.91a.25.25 0 0 0-.455-.095l-.167.4a.53.53 0 0 1-.403.322 24.76 24.76 0 0 1-1.879.18l-.92-.9a.25.25 0 0 0-.217-.068Z"/>
            <path d="M8.5 1.866a1 1 0 1 0-1 0V3h-2A4.5 4.5 0 0 0 1 7.5V9a1 1 0 0 0 .293.707l.006.007c.78.78 1.97 1.036 3.006 1.205.688.112 1.488.176 2.327.181v1.4a1 1 0 0 0 1 1h.736a1 1 0 0 0 1-1v-1.4c.839-.005 1.639-.069 2.327-.181 1.037-.17 2.226-.425 3.006-1.205l.006-.007A1 1 0 0 0 15 9V7.5A4.5 4.5 0 0 0 10.5 3h-2V1.866ZM8 4a3.5 3.5 0 0 1 3.5 3.5v1.424c-.793.13-1.871.26-3.132.274a1.75 1.75 0 0 0-.736 0c-1.261-.015-2.339-.144-3.132-.274V7.5A3.5 3.5 0 0 1 8 4Z"/>
        </svg>
        <span class="admin-chatbot-btn-text">Trợ lý cửa hàng</span>
        <span class="admin-chatbot-badge-dot" aria-hidden="true"></span>
    </button>

    <!-- Khung chat chính -->
    <section id="admin-chatbot-window" class="admin-chatbot-window d-none" role="region" aria-label="Hộp thoại Trợ lý cửa hàng">
        <!-- Header -->
        <header class="admin-chatbot-header">
            <div class="admin-chatbot-header-title">
                <div class="admin-chatbot-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.58 26.58 0 0 0 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.933.933 0 0 1-.765.935c-.845.147-2.34.346-4.235.346-1.895 0-3.39-.2-4.235-.346A.933.933 0 0 1 3 9.219V8.062Z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="admin-chatbot-h2">Trợ lý cửa hàng</h2>
                    <span class="admin-chatbot-status"><span class="status-pulse"></span> Sẵn sàng</span>
                </div>
            </div>
            <div class="admin-chatbot-header-actions">
                <button id="admin-chatbot-clear-btn" class="admin-chatbot-icon-btn" type="button" title="Xóa hội thoại" aria-label="Xóa hội thoại">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5Zm-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5ZM4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06Zm6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528ZM8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5Z"/>
                    </svg>
                </button>
                <button id="admin-chatbot-close-btn" class="admin-chatbot-icon-btn" type="button" title="Đóng trợ lý" aria-label="Đóng trợ lý">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Danh sách tin nhắn -->
        <div id="admin-chatbot-messages" class="admin-chatbot-messages" role="log" aria-live="polite" aria-atomic="false">
            <!-- Tin nhắn mở đầu mặc định -->
            <div class="admin-chat-msg admin-chat-msg-bot">
                <div class="admin-chat-bubble">
                    <p class="mb-0">Xin chào! Tôi là Trợ lý cửa hàng F6S Store 🤖. Tôi có thể hỗ trợ tra cứu doanh thu, đơn hàng, tồn kho, sản phẩm bán chạy, khách VIP và hướng dẫn thao tác.</p>
                </div>
            </div>

            <!-- Gợi ý nhanh mặc định -->
            <div id="admin-chatbot-quick-replies" class="admin-chatbot-chips" role="group" aria-label="Gợi ý nhanh">
                <button type="button" class="admin-chat-chip" data-query="Doanh thu hôm nay">📊 Doanh thu hôm nay</button>
                <button type="button" class="admin-chat-chip" data-query="Đơn chờ xử lý">⏳ Đơn chờ xử lý</button>
                <button type="button" class="admin-chat-chip" data-query="Sản phẩm sắp hết hàng">⚠️ Sản phẩm sắp hết hàng</button>
                <button type="button" class="admin-chat-chip" data-query="Top bán chạy tuần này">🏆 Top bán chạy tuần này</button>
                <button type="button" class="admin-chat-chip" data-query="Khách chi tiêu nhiều nhất">🌟 Khách chi tiêu nhiều nhất</button>
                <button type="button" class="admin-chat-chip" data-query="Phiếu hỗ trợ mới">📩 Phiếu hỗ trợ mới</button>
                <button type="button" class="admin-chat-chip" data-query="Hướng dẫn thao tác POS">📖 Hướng dẫn thao tác POS</button>
            </div>

            <!-- Typing indicator -->
            <div id="admin-chatbot-typing" class="admin-chat-msg admin-chat-msg-bot d-none" aria-hidden="true">
                <div class="admin-chat-bubble admin-chat-typing-bubble">
                    <span class="admin-dot"></span>
                    <span class="admin-dot"></span>
                    <span class="admin-dot"></span>
                </div>
            </div>
        </div>

        <!-- Khung nhập tin nhắn -->
        <footer class="admin-chatbot-input-container">
            <form id="admin-chatbot-form" class="admin-chatbot-form" novalidate>
                <input type="text" id="admin-chatbot-input" class="admin-chatbot-input"
                       placeholder="Hỏi trợ lý (VD: Doanh thu tuần này, Tồn kho Nike...)"
                       maxlength="500" autocomplete="off" aria-label="Nội dung câu hỏi">
                <button type="submit" id="admin-chatbot-send-btn" class="admin-chatbot-send-btn" aria-label="Gửi câu hỏi">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.136L2.14 7.21l11.99-4.634Z"/>
                    </svg>
                </button>
            </form>
            <div class="admin-chatbot-disclaimer">
                <span>Dữ liệu thống kê chỉ đọc · Khớp 100% Dashboard</span>
            </div>
        </footer>
    </section>
</div>
</body>
</html>
