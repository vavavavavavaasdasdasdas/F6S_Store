<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="estimate(order,isAdmin)"><div th:if="${order.orderType=='ONLINE'}" class="delivery-summary"><p>Tỉnh/Thành phố: <strong th:text="${order.provinceName ?: 'Chưa xác định tỉnh/thành'}"></strong></p><p data-delivery-estimate th:if="${@deliveryService.estimateText(order)!=null}" th:text="${@deliveryService.estimateText(order)}"></p><a th:if="${isAdmin and order.province==null and (order.status=='PENDING' or order.status=='CONFIRMED' or order.status=='PREPARING')}" th:href="@{/admin/orders/{id}(id=${order.id})}+'#order-province'">Sửa tỉnh/thành</a></div></th:block>
<section th:fragment="tracking(order)" th:if="${order.orderType=='ONLINE'}" class="admin-panel order-tracking mt-3 mb-3"><h3>Theo dõi đơn hàng</h3><div class="order-progress-scroll" role="region" aria-label="Tiến trình đơn hàng, cuộn ngang để xem" tabindex="0"><ol class="order-progress"><li th:each="step:${@orderTrackingService.steps(order)}" th:classappend="${step.current ? 'is-current' : step.at!=null ? 'is-done' : ''}" th:attr="aria-current=${step.current?'step':null}"><strong th:text="${step.label}"></strong><time th:if="${step.at!=null}" th:text="${#temporals.format(step.at,'HH:mm dd/MM/yyyy')}"></time><span th:if="${step.actor!=null}" th:text="${step.actor}"></span><span th:if="${step.at==null}">Chưa thực hiện</span></li></ol></div><p class="alert alert-warning" th:if="${order.status=='CANCELLED' or order.status=='DELIVERY_FAILED'}" th:text="${@orderTrackingService.label(order.status)}"></p><details class="mt-3"><summary>Lịch sử xử lý</summary><ol class="order-history"><li th:each="entry:${@orderTrackingService.history(order)}"><strong th:text="${@orderTrackingService.label(entry.status)}"></strong> · <time th:text="${#temporals.format(entry.changedAt,'HH:mm dd/MM/yyyy')}"></time> · <span th:text="${entry.actor}"></span><p th:if="${entry.note!=null}" th:text="${entry.note}"></p><p th:if="${entry.carrier!=null}">Đơn vị vận chuyển: <span th:text="${entry.carrier}"></span></p><p th:if="${entry.trackingCode!=null}">Mã vận đơn: <span th:text="${entry.trackingCode}"></span></p></li></ol></details></section>
</body></html>
