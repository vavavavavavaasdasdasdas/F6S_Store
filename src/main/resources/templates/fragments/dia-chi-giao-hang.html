<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<fieldset th:fragment="address(prefix,streetId,scope,showFee)" class="delivery-address col-12" data-delivery-address th:data-scope="${scope}">
<legend class="h5">Địa chỉ giao hàng chi tiết</legend>
<div class="mb-3"><label class="form-label" th:for="${prefix}+'-province'">Tỉnh/Thành phố *</label><select class="form-select" th:id="${prefix}+'-province'" th:field="*{provinceId}" required th:aria-describedby="${prefix}+'-province-error'" data-delivery-province><option value="">Chọn Tỉnh/Thành phố</option><option th:each="p:${provinces}" th:value="${p.id}" th:text="${p.name}"></option></select><p class="field-error user-message" th:id="${prefix}+'-province-error'" aria-live="polite"><span th:if="${#fields.hasErrors('provinceId')}" th:errors="*{provinceId}"></span></p></div>
<div class="mb-3"><label class="form-label" th:for="${prefix}+'-ward'">Phường/Xã *</label><select class="form-select" th:id="${prefix}+'-ward'" th:field="*{wardId}" required th:aria-describedby="${prefix}+'-ward-error'" data-delivery-ward><option value="">Chọn Phường/Xã</option><option th:each="w:${@addressDirectory.wards(#object.provinceId)}" th:value="${w.id}" th:text="${w.name}"></option></select><p class="field-error user-message" th:id="${prefix}+'-ward-error'" aria-live="polite"><span th:if="${#fields.hasErrors('wardId')}" th:errors="*{wardId}"></span></p></div>
<div class="mb-3"><label class="form-label" th:for="${streetId}">Số nhà, tên đường *</label><input class="form-control" th:id="${streetId}" th:field="*{streetAddress}" maxlength="255" autocomplete="street-address" required th:aria-describedby="${streetId}+'-error'" data-delivery-street><p class="field-error user-message" th:id="${streetId}+'-error'" aria-live="polite"><span th:if="${#fields.hasErrors('streetAddress')}" th:errors="*{streetAddress}"></span></p></div>
<input type="hidden" th:field="*{latitude}" th:id="${prefix}+'-latitude'" data-delivery-latitude><input type="hidden" th:field="*{longitude}" th:id="${prefix}+'-longitude'" data-delivery-longitude><input type="hidden" th:field="*{coordinateSource}" th:id="${prefix}+'-source'" data-delivery-source>
<div class="d-flex flex-wrap gap-2 mb-2"><button type="button" class="btn btn-outline-primary" data-use-location>Dùng vị trí của tôi</button><button type="button" class="btn btn-outline-secondary" data-clear-location>Dùng tâm phường/xã</button></div><p class="small text-muted">Cho phép định vị để ghim vị trí. Bạn luôn có thể chọn tay, bấm hoặc kéo ghim để chỉnh; định vị cần HTTPS hoặc localhost.</p>
<p class="user-message" role="status" aria-live="polite" data-location-message></p><div class="delivery-map" th:id="${prefix}+'-map'" data-delivery-map role="region" aria-label="Bản đồ chọn điểm giao hàng"></div><p class="small text-muted" data-delivery-point>Chưa có vị trí ghim.</p>
<div th:if="${showFee}" class="delivery-quote mt-3" aria-live="polite"><p>Phí vận chuyển: <strong data-delivery-fee>Chọn địa chỉ để tính phí</strong></p><p>Khoảng cách: <span data-delivery-distance>Chưa xác định</span></p><p data-delivery-note></p><p class="text-success" data-delivery-hint></p></div>
<link rel="stylesheet" href="/js/vendor/leaflet/leaflet.css"><script src="/js/vendor/leaflet/leaflet.js" defer></script><script src="/js/dia-chi-giao-hang.js" defer></script>
</fieldset></body></html>
