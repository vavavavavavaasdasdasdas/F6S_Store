<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="widget" id="f6s-chatbot-container" class="f6s-chatbot-container">
<button id="chatbot-toggle-btn" class="chatbot-toggle-btn" type="button" aria-label="Mở hỗ trợ khách hàng" aria-expanded="false" aria-controls="chatbot-window"><i class="bi bi-chat-dots-fill" aria-hidden="true"></i><span class="support-badge" data-chat-badge hidden>0</span></button>
<section id="chatbot-window" class="support-window" role="dialog" aria-labelledby="support-title" aria-modal="false" hidden tabindex="-1">
<header class="support-header"><img src="/images/logo.jpg" alt="Logo F6S Store" width="52" height="34"><div><h2 id="support-title">F6S Store Support</h2><p><span data-chat-online-dot class="support-online-dot"></span><span data-chat-presence>Trực tuyến · Sẵn sàng hỗ trợ</span></p></div><button type="button" class="support-icon" data-chat-close title="Đóng khung chat" aria-label="Đóng khung chat"><i class="bi bi-x-lg" aria-hidden="true"></i></button></header>
<p class="support-notice">Cuộc trò chuyện được lưu để nhân viên F6S Store hỗ trợ bạn tốt nhất.</p>
<p class="support-connection" data-chat-connection role="status">Đang kết nối…</p>
<div class="support-error" data-chat-error role="alert" hidden></div><button type="button" class="btn btn-sm btn-outline-secondary support-reset" data-chat-reset hidden>Bắt đầu phiên chat mới</button>
<form method="post" th:action="@{/api/support/session}" data-chat-identity class="support-identity" novalidate hidden><h3>Bắt đầu trò chuyện</h3><p>Cho cửa hàng biết tên và cách liên hệ với bạn.</p><label for="support-name">Họ và tên *</label><input id="support-name" name="name" class="form-control" required maxlength="100" autocomplete="name" aria-describedby="support-identity-error"><label for="support-contact">Số điện thoại hoặc email *</label><input id="support-contact" name="contact" class="form-control" required maxlength="100" autocomplete="email" aria-describedby="support-identity-error"><p id="support-identity-error" class="field-error" aria-live="polite"></p><button type="submit" class="btn btn-primary">Bắt đầu trò chuyện</button></form>
<div class="support-history" data-chat-history tabindex="0" aria-label="Lịch sử trò chuyện, cuộn lên để tải thêm"><button type="button" class="support-load-older" data-chat-older hidden>Tải tin nhắn cũ hơn</button><div data-chat-messages role="log" aria-live="polite" aria-relevant="additions"></div><div class="support-quick" data-chat-quick><p>Chào bạn! Cửa hàng <strong>F6S Store</strong> có thể hỗ trợ gì cho bạn?</p><button type="button" data-chat-query="Tìm giày">👟 Tìm giày</button><button type="button" data-chat-query="Tư vấn size">📏 Tư vấn size</button><button type="button" data-chat-query="Chính sách đổi trả">🔄 Chính sách đổi trả</button><button type="button" data-chat-query="Kiểm tra đơn hàng">📦 Kiểm tra đơn hàng</button><button type="button" data-chat-human>💬 Gặp nhân viên</button></div></div>
<p class="support-typing" data-chat-typing aria-live="polite"></p>
<footer class="support-compose" data-chat-compose hidden><div class="support-tools"><button type="button" class="support-icon" data-chat-attach title="Đính kèm ảnh" aria-label="Đính kèm ảnh"><i class="bi bi-image" aria-hidden="true"></i></button><input type="file" data-chat-file accept="image/jpeg,image/png,image/webp" hidden><button type="button" class="support-tool" data-chat-product hidden>Gửi sản phẩm đang xem</button><button type="button" class="support-tool" data-chat-orders hidden>Gửi đơn hàng</button><button type="button" class="support-tool" data-chat-human>Gặp nhân viên</button></div><div class="support-input-row"><label class="visually-hidden" for="chatbot-input">Tin nhắn cho cửa hàng</label><textarea id="chatbot-input" rows="1" maxlength="2000" placeholder="Nhập tin nhắn…" aria-describedby="support-character-count"></textarea><button id="chatbot-send-btn" type="button" class="support-send" aria-label="Gửi tin nhắn" title="Gửi tin nhắn"><i class="bi bi-send-fill" aria-hidden="true"></i></button></div><p id="support-character-count" class="support-counter" hidden></p></footer>
</section>
<dialog data-chat-order-picker class="user-dialog" aria-labelledby="support-order-title"><h2 id="support-order-title">Gửi đơn hàng</h2><label for="support-order">Chọn đơn hàng của bạn</label><select id="support-order" class="form-select" data-chat-order><option value="">Chọn đơn hàng</option></select><p data-chat-order-message role="status"></p><div class="d-flex gap-2 my-3"><button type="button" class="btn btn-outline-secondary" data-chat-order-prev>Trước</button><span data-chat-order-page></span><button type="button" class="btn btn-outline-secondary" data-chat-order-next>Sau</button></div><div class="user-dialog-actions"><button type="button" class="btn btn-outline-secondary" data-chat-order-cancel>Đóng</button><button type="button" class="btn btn-primary" data-chat-order-send>Gửi đơn hàng</button></div></dialog>
<script src="/js/support-chat-view.js" defer></script><script src="/js/vendor/sockjs-1.6.1.min.js" defer></script><script src="/js/vendor/stomp-7.2.1.min.js" defer></script>
</div></body></html>
