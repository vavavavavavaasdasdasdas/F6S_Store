<div th:fragment="header">
    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2 py-1" th:href="@{/}">
                <img class="shop-logo" src="/images/logo.jpg" alt="Logo F6S Store">
                <div class="d-flex flex-column leading-none">
                    <span class="brand-text lh-1">F6S STORE</span>
                    <span class="d-none d-sm-block text-muted mt-1" style="font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;">SNEAKERS & STREETWEAR</span>
                </div>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-2 gap-lg-0 gap-xl-1 text-nowrap">
                    <li class="nav-item">
                        <a class="nav-link fw-bold px-2 px-xl-3 text-nowrap" th:href="@{/}">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold px-2 px-xl-3 text-nowrap" th:href="@{/products}">Sản phẩm</a>
                    </li>
                    <li class="nav-item dropdown">
                        <button type="button" class="nav-link dropdown-toggle fw-bold px-2 px-xl-3 text-nowrap" data-bs-toggle="dropdown" aria-expanded="false">Thương hiệu</button>
                        <ul class="dropdown-menu border-0 shadow-sm rounded-3">
                            <li th:each="cat : ${globalCategories}">
                                <a class="dropdown-item py-2" th:href="@{/category/{id}(id=${cat.id})}" th:text="${cat.name}"></a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-danger px-2 px-xl-3 text-nowrap" th:href="@{/products(promotion=true)}"><i class="bi bi-fire"></i> Khuyến mãi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-muted px-2 px-xl-3 text-nowrap" th:href="@{/orders}"><i class="bi bi-truck me-1"></i> Tra cứu đơn</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2 gap-lg-3 flex-shrink-0">
                    <form class="d-flex position-relative store-search" th:action="@{/products}" method="get" style="min-width: 180px; max-width: 240px;">
                        <input class="form-control rounded-pill bg-light border-0" style="padding-left: 2.75rem; padding-right: 1.25rem;" type="search" name="keyword" aria-label="Tìm sản phẩm" placeholder="Tìm giày, thương hiệu...">
                        <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" style="pointer-events: none;"></i>
                    </form>

                    <a th:href="@{/cart}" class="nav-link position-relative text-dark fs-5 p-2 rounded-circle" aria-label="Giỏ hàng" title="Giỏ hàng">
                        <i class="bi bi-bag"></i>
                        <span class="cart-badge badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle" id="cartBadge" th:text="${cartCount}">0</span>
                    </a>

                    <div class="nav-item dropdown ms-1">
                        <button type="button" class="nav-link fs-5 text-dark p-2" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Tài khoản">
                            <i class="bi bi-person-circle"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm rounded-3">
                            <li sec:authorize="!isAuthenticated()">
                                <a class="dropdown-item py-2" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập</a>
                            </li>
                            <li sec:authorize="!isAuthenticated()">
                                <a class="dropdown-item py-2" th:href="@{/register}"><i class="bi bi-person-plus me-2"></i> Đăng ký</a>
                            </li>
                            <li sec:authorize="isAuthenticated()">
                                <a class="dropdown-item py-2" th:with="profileUrl=${@adminAccess.allowed(#authentication,'GET','/admin/account')?'/admin/account':'/profile'}" th:href="${profileUrl}"><i class="bi bi-person me-2"></i> Hồ sơ cá nhân</a>
                            </li>
                            <li sec:authorize="isAuthenticated()">
                                <a class="dropdown-item py-2" th:href="@{/orders}"><i class="bi bi-bag-check me-2"></i> Đơn hàng của tôi</a>
                                <a class="dropdown-item py-2" href="/favorites"><i class="bi bi-heart me-2"></i> Sản phẩm yêu thích</a>
                            </li>
                            <li sec:authorize="hasAnyRole('ADMIN','EMPLOYEE')">
                                <a class="dropdown-item py-2 text-danger" th:with="staffHome=${@adminAccess.home(#authentication)}" th:href="${staffHome}"><i class="bi bi-shield-lock me-2"></i> Không gian quản trị</a>
                            </li>
                            <li sec:authorize="isAuthenticated()"><hr class="dropdown-divider"></li>
                            <li sec:authorize="isAuthenticated()">
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item py-2 text-danger"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>
