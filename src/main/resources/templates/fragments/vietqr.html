<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="payment(order)"><th:block th:with="qr=${@vietQrService.forOrder(order)}"><section class="admin-panel vietqr-panel mt-3 mb-3" th:if="${qr!=null}" aria-label="Thông tin chuyển khoản"><h3>Chuyển khoản thanh toán</h3><p th:unless="${qr.configured}" th:text="${qr.message}"></p><th:block th:if="${qr.configured}"><canvas class="vietqr-canvas" data-vietqr th:data-payload="${qr.payload}" aria-label="Mã QR chuyển khoản đúng số tiền"></canvas><dl><dt>Số tiền</dt><dd th:text="${@money.format(order.finalAmount)}+' đ'"></dd><dt>Ngân hàng</dt><dd th:text="${qr.bankName}"></dd><dt>Chủ tài khoản</dt><dd th:text="${qr.accountName}"></dd><dt>Số tài khoản</dt><dd th:text="${qr.account}"></dd><dt>Nội dung</dt><dd th:text="${qr.content}"></dd></dl><p class="text-muted">Kiểm tra thông tin trên ứng dụng ngân hàng trước khi chuyển khoản. Cửa hàng xác nhận khi nhận được tiền.</p></th:block></section><script th:if="${qr!=null}" src="/js/vendor/qrcodegen-1.8.0.js" defer></script><script th:if="${qr!=null}" src="/js/vietqr.js" defer></script></th:block></th:block>
</body></html>
