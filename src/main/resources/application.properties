server.port=8080
server.servlet.session.persistent=false

# Cấu hình máy phát triển (được gitignore); biến môi trường vẫn có độ ưu tiên cao hơn.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate

spring.thymeleaf.cache=false

# Upload dir if needed later
upload.dir=uploads




shop.page-size=12

shop.low-stock-threshold=5
shop.time-zone=Asia/Ho_Chi_Minh

shop.upload-dir=uploads/products
shop.upload-max-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Existing employee permission model
shop.employee-role=ROLE_ADMIN

# Receipt information follows the existing storefront sample contact details.
shop.name=${SHOP_NAME:SHOES Store}
shop.address=${SHOP_ADDRESS:123 \u0110\u01b0\u1eddng S\u1ed1 1, HCM}
shop.phone=${SHOP_PHONE:1900 1234}

# Đơn chuyển khoản chưa thanh toán: thời hạn giữ hàng và chu kỳ kiểm tra.
shop.order.bank-transfer-timeout-hours=24
shop.order.bank-transfer-cleanup-interval=PT5M

# SMTP credentials are provided only through the environment. Never enable mail debug.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
shop.mail.from=${MAIL_FROM:}
shop.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
shop.account-mail.max-per-hour=3

# VietQR generated locally; no bank/QR web service is contacted.
shop.bank.bin=${SHOP_BANK_BIN:}
shop.bank.account=${SHOP_BANK_ACCOUNT:}
shop.bank.account-name=${SHOP_BANK_ACCOUNT_NAME:}
shop.bank.name=${SHOP_BANK_NAME:}

# Geocoding được proxy/cache ở server; test tự động tắt hoặc trỏ máy chủ giả localhost.
shop.geocoding.enabled=${SHOP_GEOCODING_ENABLED:true}
shop.geocoding.base-url=${SHOP_GEOCODER_URL:https://nominatim.openstreetmap.org}
shop.geocoding.user-agent=${SHOP_GEOCODER_USER_AGENT:F6S-Store/1.0 (+https://github.com/vavavavavavaasdasdasdas/F6S_Store)}
shop.geocoding.tile-url=${SHOP_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
shop.geocoding.timeout-millis=${SHOP_GEOCODER_TIMEOUT_MS:2000}
shop.geocoding.min-interval-millis=${SHOP_GEOCODER_MIN_INTERVAL_MS:1100}
shop.geocoding.cache-seconds=${SHOP_GEOCODER_CACHE_SECONDS:600}
shop.geocoding.retry-seconds=${SHOP_GEOCODER_RETRY_SECONDS:300}
shop.geocoding.requests-per-minute=${SHOP_GEOCODER_REQUESTS_PER_MINUTE:20}
