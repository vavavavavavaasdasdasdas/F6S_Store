server.port=8080
server.servlet.session.persistent=false

# Cấu hình máy phát triển (được gitignore); biến môi trường vẫn có độ ưu tiên cao hơn.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none

spring.thymeleaf.cache=false

# Upload dir if needed later
upload.dir=uploads




shop.page-size=12
shop.shipping.fee=30000
shop.shipping.free-threshold=500000

shop.low-stock-threshold=5
shop.time-zone=Asia/Ho_Chi_Minh

shop.upload-dir=uploads/products
shop.upload-max-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Existing employee permission model
shop.employee-role=ROLE_ADMIN

# Receipt information follows the existing storefront sample contact details.
shop.name=${SHOP_NAME:SHOES Store}
shop.address=${SHOP_ADDRESS:123 \u0110\u01b0\u1eddng S\u1ed1 1, HCM}
shop.phone=${SHOP_PHONE:1900 1234}

# Đơn chuyển khoản chưa thanh toán: thời hạn giữ hàng và chu kỳ kiểm tra.
shop.order.bank-transfer-timeout-hours=24
shop.order.bank-transfer-cleanup-interval=PT5M
