# Sao chép thành application-local.properties tại gốc dự án rồi điền mật khẩu trên máy.
# File cục bộ được ứng dụng tự đọc và đã nằm trong .gitignore; không commit mật khẩu.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shop_verify;encrypt=false;trustServerCertificate=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
server.port=8080
shop.upload-dir=verify/uploads

# SMTP: secrets must stay in environment variables.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
shop.mail.from=${MAIL_FROM:}
shop.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
# MAIL_AUTH=true and MAIL_STARTTLS=true by default; disable only for local fake SMTP.

# VietQR generated locally; no bank/QR web service is contacted.
shop.bank.bin=${SHOP_BANK_BIN:}
shop.bank.account=${SHOP_BANK_ACCOUNT:}
shop.bank.account-name=${SHOP_BANK_ACCOUNT_NAME:}
shop.bank.name=${SHOP_BANK_NAME:}
